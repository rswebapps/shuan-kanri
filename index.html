// ─── A様式 HTML生成（横向きA4・XLS列順・自動スケール）──────────────
function buildReportAHtml(untilMonth){
  const ts=targets();
  const showMod=hasActiveMod();
  const rMonths=reportMonths(untilMonth);
  const grade=typeof S.grade==='number'?`${S.grade}学年`:'専科';
  const schoolName=S.schoolName||'';
  const cls=S.cls||'';
  const teacher=S.teacher||'';

  const monthActual={};
  for(const m of MONTH_ORDER) monthActual[m]=calcMonth(m);
  // semActualはrMonths範囲内のみ集計（選択期間以降のデータを除外）
  const semActual={};
  for(const sem of ['1','2','3']){
    const semRMons=SEMS[sem].months.filter(m=>rMonths.includes(m));
    semActual[sem]=calcActual(semRMons.map(m=>({m,weeks:[1,2,3,4,5,6]})));
  }
  const yearActual=calcActual(rMonths.map(m=>({m,weeks:[1,2,3,4,5,6]})));
  const bySem={},modBySem={};
  for(const t of ts){bySem[t]=planBySem(t);modBySem[t]=planModBySem(t);}

  // XLS列順: 教科|年間実績|年間予定|年間過不足|[sem1全月]|sem1実績|sem1予定|sem1過不足|[sem2全月]|…
  // A様式は常に12ヶ月全列を表示。rMonths外・データなしは空白。
  // ヘッダー（1行）
  let hdr='<tr>';
  hdr+=`<th>教科</th><th>年間<br>実績</th><th>年間<br>予定</th><th>年間<br>過不足</th>`;
  for(const sem of ['1','2','3']){
    for(const m of SEMS[sem].months) hdr+=`<th class="mon-hd">${m}月</th>`;  // 全月を常に表示
    const sl=SEMS[sem].label;
    hdr+=`<th>${sl}<br>実績</th>`;
    if(showMod) hdr+=`<th>うち<br>モ</th>`;
    hdr+=`<th>${sl}<br>予定</th>`;
    if(showMod) hdr+=`<th>うち<br>モ</th>`;
    hdr+=`<th>${sl}<br>過不足</th>`;
  }
  hdr+='</tr>';

  // データ行・合計行
  let tbodyRows='';
  let totYAct=0,totYPlan=0;
  const semTot={'1':{act:0,modA:0,plan:0,modP:0},'2':{act:0,modA:0,plan:0,modP:0},'3':{act:0,modA:0,plan:0,modP:0}};

  for(const t of ts){
    const pl=planForTarget(t);
    const yAct=yearActual[t]?.tot||0;
    const yPlan=pl.planTotal;
    totYAct+=yAct; totYPlan+=yPlan;
    const yDiff=yAct-yPlan;
    const ydc=Math.abs(yDiff)<0.01?'':`color:${yDiff>=0?'#324851':'#c62828'}`;
    let row=`<td class="tn">${t}</td><td>${fmtR1(yAct)||0}</td><td>${yPlan||0}</td><td style="${ydc}">${yPlan?fmtDiffR1(yDiff):'-'}</td>`;
    for(const sem of ['1','2','3']){
      for(const m of SEMS[sem].months){
        // rMonths内の月はデータ表示、範囲外は空白
        const v=rMonths.includes(m)?(monthActual[m]?.[t]?.tot||0):null;
        row+=`<td>${v!==null?fmtR1(v):''}</td>`;
      }
      const sAct=semActual[sem]?.[t]?.tot||0;
      const sModA=semActual[sem]?.[t]?.modTime||0;
      const sPlan=bySem[t]?.[sem]||0;
      const sModP=modBySem[t]?.[sem]||0;
      const sDiff=sAct-sPlan;
      const sdc=Math.abs(sDiff)<0.01?'':`color:${sDiff>=0?'#324851':'#c62828'}`;
      semTot[sem].act+=sAct; semTot[sem].modA+=sModA; semTot[sem].plan+=sPlan; semTot[sem].modP+=sModP; // modAは時数
      row+=`<td>${fmtR1(sAct)||'-'}</td>${showMod?`<td>${fmtR1(sModA)||'-'}</td>`:''}<td>${sPlan||'-'}</td>${showMod?`<td>${sModP||'-'}</td>`:''}<td style="${sdc}">${sPlan?fmtDiffR1(sDiff):'-'}</td>`;
    }
    tbodyRows+=`<tr>${row}</tr>`;
  }

  // 合計行
  const yTotDiff=totYAct-totYPlan;
  const ytdc=Math.abs(yTotDiff)<0.01?'':`color:${yTotDiff>=0?'#324851':'#c62828'}`;
  let ftRow=`<td class="tn">合計</td><td>${fmtR1nz(totYAct)}</td><td>${totYPlan||0}</td><td style="${ytdc}">${totYPlan?fmtDiffR1(yTotDiff):'-'}</td>`;
  for(const sem of ['1','2','3']){
    for(const m of SEMS[sem].months){
      const v=rMonths.includes(m)?ts.reduce((s,t)=>s+(monthActual[m]?.[t]?.tot||0),0):null;
      ftRow+=`<td>${v!==null?fmtR1(v):''}</td>`;
    }
    const{act,modA,plan,modP}=semTot[sem];
    const sDiff=act-plan;
    const sdc=Math.abs(sDiff)<0.01?'':`color:${sDiff>=0?'#324851':'#c62828'}`;
    ftRow+=`<td>${fmtR1nz(act)}</td>${showMod?`<td>${fmtR1(modA)||'-'}</td>`:''}<td>${plan||'-'}</td>${showMod?`<td>${modP||'-'}</td>`:''}<td style="${sdc}">${plan?fmtDiffR1(sDiff):'-'}</td>`;
  }

  // 検印欄
  const stampHtml=`<div class="stamp-row">
    <div class="stamp-box"><div class="stamp-lbl">校長</div><div class="stamp-seal"></div></div>
    <div class="stamp-box"><div class="stamp-lbl">教頭</div><div class="stamp-seal"></div></div>
    <div class="stamp-box"><div class="stamp-lbl">教務</div><div class="stamp-seal"></div></div>
  </div>`;

  return `<div class="rpt-page rpt-a">
    <div class="rpt-inner" id="rpt-a-inner">
      <div class="rpt-hd">
        <div class="rpt-title">令和${S.year-2018}年度　月別授業実施時数一覧表（第${grade}）</div>
        <div class="rpt-sub">${schoolName}　${grade}${cls}　担任：${teacher}</div>
      </div>
      <table class="rpt-tbl" id="rpt-a-tbl">
        <colgroup id="rpt-a-col"></colgroup>
        <thead>${hdr}</thead>
        <tbody>${tbodyRows}</tbody>
        <tfoot><tr class="ft">${ftRow}</tr></tfoot>
      </table>
      ${stampHtml}
    </div>
  </div>`;
}


// ─── B様式 HTML生成（横3ヶ月・自動スケール）────────────────────────
function buildReportBHtml(untilMonth){
  const ts=targets();
  const showMod=hasActiveMod();
  const rMonths=reportMonths(untilMonth);
  const grade=typeof S.grade==='number'?`${S.grade}学年`:'専科';
  const schoolName=S.schoolName||'';
  const cls=S.cls||'';
  const teacher=S.teacher||'';

  const activeMons=rMonths.filter(m=>{
    const act=calcMonth(m);return ts.some(t=>(act[t]?.tot||0)>0);
  });
  if(!activeMons.length) return '';

  const byMonth={},bySem={},modBySem={};
  for(const t of ts){byMonth[t]=planByMonth(t);bySem[t]=planBySem(t);modBySem[t]=planModBySem(t);}

  // 2ヶ月ごとにページ（A4横で各月50%幅確保）
  const pages=[];
  for(let i=0;i<activeMons.length;i+=2) pages.push(activeMons.slice(i,i+2));

  let allHtml='';
  pages.forEach((pageMons,pi)=>{
    // 各月ブロックのHTMLを生成
    const blocks=pageMons.map(m=>{
      const act=calcMonth(m);
      const sem=semOf(m);
      // semActはrMonths範囲内のみ集計
      const semRMonsB=SEMS[sem].months.filter(m2=>rMonths.includes(m2));
      const semAct=calcActual(semRMonsB.map(m2=>({m:m2,weeks:[1,2,3,4,5,6]})));
      const validWks=validWeeksForMonth(m);
      const sl=SEMS[sem].label;

      let thead=`<tr><th class="tn">${m}月</th>`;
      for(const w of validWks) thead+=`<th>第${w}週</th>`;
      thead+=`<th>月計</th>${showMod?'<th>うちモ</th>':''}`;
      thead+=`<th>${sl}<br>実績</th>${showMod?'<th>うちモ</th>':''}`;
      thead+=`<th>${sl}<br>予定</th>${showMod?'<th>うちモ</th>':''}`;
      thead+=`<th>${sl}<br>過不足</th></tr>`;

      let tbody='';
      for(const t of ts){
        const mAct=act[t]?.tot||0;
        const mModAct=act[t]?.modTime||0;  // 時数（コマ数でなく）
        const sAct=semAct[t]?.tot||0;
        const sModAct=semAct[t]?.mod||0;   // xlsx: コマ数
        const sPlan=bySem[t]?.[sem]||0;
        const sModPlan=modBySem[t]?.[sem]||0;
        const sDiff=sAct-sPlan;
        const dc=Math.abs(sDiff)<0.01?'':`color:${sDiff>=0?'#324851':'#c62828'}`;
        let row=`<td class="tn">${t}</td>`;
        for(const w of validWks) row+=`<td>${fmtR1(calcWeek(m,w)[t]?.tot)||'-'}</td>`;
        row+=`<td class="mc">${fmtR1(mAct)||'-'}</td>${showMod?`<td>${fmtR1(mModAct)||'-'}</td>`:''}`
            +`<td>${fmtR1(sAct)||'-'}</td>${showMod?`<td>${fmtR1(sModAct)||'-'}</td>`:''}`
            +`<td>${sPlan||'-'}</td>${showMod?`<td>${sModPlan||'-'}</td>`:''}`
            +`<td style="${dc}">${sPlan?fmtDiffR1(sDiff):'-'}</td>`;
        tbody+=`<tr>${row}</tr>`;
      }

      // 合計行
      const mTotAct=ts.reduce((s,t)=>s+(act[t]?.tot||0),0);
      const mTotMod=ts.reduce((s,t)=>s+(act[t]?.modTime||0),0);
      const sTotAct=ts.reduce((s,t)=>s+(semAct[t]?.tot||0),0);
      const sTotMod=ts.reduce((s,t)=>s+(semAct[t]?.modTime||0),0);
      const sTotPlan=ts.reduce((s,t)=>s+(bySem[t]?.[sem]||0),0);
      const sTotModP=ts.reduce((s,t)=>s+(modBySem[t]?.[sem]||0),0);
      const sTotDiff=sTotAct-sTotPlan;
      const tdc=Math.abs(sTotDiff)<0.01?'':`color:${sTotDiff>=0?'#324851':'#c62828'}`;
      let ftRow=`<td class="tn">合計</td>`;
      for(const w of validWks) ftRow+=`<td>${fmtR1(ts.reduce((s,t)=>s+(calcWeek(m,w)[t]?.tot||0),0))||'-'}</td>`;
      ftRow+=`<td class="mc">${fmtR1nz(mTotAct)}</td>${showMod?`<td>${fmtR1(mTotMod)||'-'}</td>`:''}`
           +`<td>${fmtR1nz(sTotAct)}</td>${showMod?`<td>${fmtR1(sTotMod)||'-'}</td>`:''}`
           +`<td>${sTotPlan||'-'}</td>${showMod?`<td>${sTotModP||'-'}</td>`:''}`
           +`<td style="${tdc}">${sTotPlan?fmtDiffR1(sTotDiff):'-'}</td>`;

      return `<div class="b-block"><table class="rpt-tbl b-tbl"><thead>${thead}</thead><tbody>${tbody}</tbody><tfoot><tr class="ft">${ftRow}</tr></tfoot></table></div>`;
    });

    allHtml+=`<div class="rpt-page rpt-b">
      <div class="rpt-inner" id="rpt-b-inner-${pi}">
        <div class="rpt-hd">
          <div class="rpt-title">令和${S.year-2018}年度　月別授業実施時数一覧表（第${grade}）</div>
          <div class="rpt-sub">${schoolName}　${grade}${cls}　担任：${teacher}　${pi+1}ページ</div>
        </div>
        <div class="b-blocks">${blocks.join('')}</div>
      </div>
    </div>`;
  });
  return allHtml;
}

// ─── 印刷出力（A様式 + B様式）────────────────────────────────────
function printReport(untilMonth){
  const aHtml=buildReportAHtml(untilMonth);
  const bHtml=buildReportBHtml(untilMonth);
  const root=document.getElementById('rpt-print-root');
  root.innerHTML=aHtml+bHtml;
  root.style.display='block';
  document.body.classList.add('rpt-printing'); // 他印刷への影響を防ぐ
  // 実施報告用の @page landscape を動的注入（他の印刷に影響させない）
  const rptStyle=document.createElement('style');
  rptStyle.id='rpt-page-style';
  rptStyle.textContent='@page{size:A4 landscape;margin:10mm}';
  document.head.appendChild(rptStyle);

  // autoScale（現在ページ内のrpt-innerに適用）
  root.querySelectorAll('.rpt-inner').forEach(inner=>{
    const page=inner.closest('.rpt-page');
    if(!page) return;
    inner.style.transform='none';inner.style.width='100%';inner.style.height='100%';
    if(page.classList.contains('rpt-a')){
      const cg=inner.querySelector('#rpt-a-col');
      const tbl=inner.querySelector('#rpt-a-tbl');
      if(cg&&tbl){
        cg.innerHTML='';
        const heads=tbl.querySelectorAll('thead tr:first-child th');
        const nCols=heads.length;
        // 列種別ごとの基本幅を計算
        // 教科列: 4%（2文字固定）, 年間3列: 各4%, 学期集計列: 各5%
        // 残りを月列（12列）で均等配分
        const fixedPct_subj=4;
        const fixedPct_year=4;   // ×3列
        const fixedPct_sem=5;    // ×(3+mod)×3列
        // 月列数・学期集計列数をカウント
        let nMon=0,nSem=0;
        heads.forEach((th,i)=>{
          if(i===0||i<=3) return;
          if(/^\d+月$/.test(th.textContent.trim())) nMon++;
          else nSem++;
        });
        const usedPct=fixedPct_subj+fixedPct_year*3+fixedPct_sem*nSem;
        const monPct=nMon>0?Math.max(1.5,(100-usedPct)/nMon):2.5;

        let monColWidthPx=0; // 月列の実ピクセル幅（フォントサイズ計算用）
        const pageWidthPx=page.clientWidth||1047;

        heads.forEach((th,i)=>{
          const col=document.createElement('col');
          const txt=th.textContent.trim();
          let pct;
          if(i===0)       pct=fixedPct_subj;
          else if(i<=3)   pct=fixedPct_year;
          else if(/^\d+月$/.test(txt)) pct=monPct;
          else             pct=fixedPct_sem;
          col.style.width=pct+'%';
          cg.appendChild(col);
          if(/^\d+月$/.test(txt)) monColWidthPx=pageWidthPx*pct/100;
        });

        // ② 月列のフォントサイズ: 列幅(px)から逆算（係数0.18、最小6pt最大9pt）
        // 印刷96dpi換算: 1pt≈1.333px → ptをpxに換算して係数調整
        const monFontPt=Math.min(9,Math.max(6,Math.round(monColWidthPx*0.18)));
        // 月列セル（ヘッダー・データ・合計）にフォントサイズ適用
        requestAnimationFrame(()=>{
          tbl.querySelectorAll('th.mon-hd').forEach(th=>{th.style.fontSize=monFontPt+'pt';});
          // データ行・合計行の月列セルは colgroup のwidthで自動縮小されるが
          // セル内の数値フォントも縮小する（教科列以降の月位置のtd）
          const nFixed=1+3; // 教科+年間3列
          tbl.querySelectorAll('tbody tr, tfoot tr').forEach(tr=>{
            const tds=[...tr.querySelectorAll('td')];
            // 月列位置のtdにフォント適用（nFixed番目からnFixed+nMon-1番目）
            // 学期ごとに月列が挟まるため、学期ブロック単位で走査
            let tdIdx=0;
            heads.forEach((th,hi)=>{
              if(hi===0){tdIdx++;return;}
              if(hi<=3){tdIdx++;return;}
              const txt2=th.textContent.trim();
              if(/^\d+月$/.test(txt2)){
                if(tds[tdIdx]) tds[tdIdx].style.fontSize=monFontPt+'pt';
                tdIdx++;
              } else {
                tdIdx++;
              }
            });
          });
        });
      }
    }
    if(page.classList.contains('rpt-b')){
      const blocks=inner.querySelectorAll('.b-block');
      const bw=Math.floor((page.clientWidth-4)/2);
      blocks.forEach(b=>{
        b.style.width=bw+'px';b.style.minWidth=bw+'px';b.style.maxWidth=bw+'px';
        // B様式: 教科列を2文字固定（約10%）、残りを週・集計列で均等配分
        const btbl=b.querySelector('.b-tbl');
        if(!btbl) return;
        const bheads=btbl.querySelectorAll('thead tr th');
        const bcg=document.createElement('colgroup');
        const bPct_subj=10; // 教科列
        const bPct_sem=8;   // 学期実績/予定/過不足
        let nWks=0,nSemCols=0;
        bheads.forEach((th,i)=>{
          if(i===0) return;
          const t=th.textContent.trim();
          if(/^(第\d週|月計|うちモ)$/.test(t)) nWks++;
          else nSemCols++;
        });
        const bUsed=bPct_subj+bPct_sem*nSemCols;
        const bWkPct=nWks>0?Math.max(5,(100-bUsed)/nWks):8;
        // フォントサイズ計算
        const wkWidthPx=bw*bWkPct/100;
        const wkFontPt=Math.min(9,Math.max(6,Math.round(wkWidthPx*0.18)));
        bheads.forEach((th,i)=>{
          const col=document.createElement('col');
          const t=th.textContent.trim();
          let pct;
          if(i===0) pct=bPct_subj;
          else if(/^(第\d週|月計|うちモ)$/.test(t)) pct=bWkPct;
          else pct=bPct_sem;
          col.style.width=pct+'%';
          bcg.appendChild(col);
        });
        btbl.prepend(bcg);
        requestAnimationFrame(()=>{
          btbl.querySelectorAll('th,td').forEach(cell=>{
            const t=cell.textContent.trim();
            if(/^(第\d週|月計|\d+\.\d)$/.test(t)||cell.classList.contains('mc'))
              cell.style.fontSize=wkFontPt+'pt';
          });
        });
      });
    }
    const ph=page.clientHeight||718;
    const ch=inner.scrollHeight;
    const scale=Math.min(ph/ch,1);
    if(scale<0.995){
      inner.style.transform='scale('+scale+')';
      inner.style.transformOrigin='top left';
      inner.style.width=(100/scale)+'%';
      inner.style.height=(100/scale)+'%';
    }
  });

  // 印刷後にroot を非表示・クリア
  const cleanup=()=>{
    root.style.display='none';
    root.innerHTML='';
    document.body.classList.remove('rpt-printing'); // 他印刷への影響を解除
    // 動的注入した @page スタイルを除去（次の印刷に影響させない）
    const rs=document.getElementById('rpt-page-style');
    if(rs) rs.remove();
    window.removeEventListener('afterprint',cleanup);
  };
  window.addEventListener('afterprint',cleanup);
  setTimeout(()=>window.print(),100);
}

// ─── xlsx出力（A様式 + B様式）───────────────────────────────────
function exportReportXlsx(untilMonth){
  if(typeof XLSX==='undefined'){alert('SheetJSの読み込みに失敗しました。');return;}
  const ts=targets();
  const showMod=hasActiveMod();
  const rMonths=reportMonths(untilMonth);
  const grade=typeof S.grade==='number'?`${S.grade}学年`:'専科';
  const cls=S.cls||'';
  const teacher=S.teacher||'';
  const schoolName=S.schoolName||'';

  const byMonth={},bySem={},modByMonth={},modBySem={};
  for(const t of ts){
    byMonth[t]=planByMonth(t);
    bySem[t]=planBySem(t);
    modByMonth[t]=planModByMonth(t);
    modBySem[t]=planModBySem(t);
  }

  const monthActual={};
  for(const m of MONTH_ORDER) monthActual[m]=calcMonth(m);
  // semActualはrMonths範囲内のみ集計（選択期間以降のデータを除外）
  const semActual={};
  for(const sem of ['1','2','3']){
    const semRMons=SEMS[sem].months.filter(m=>rMonths.includes(m));
    semActual[sem]=calcActual(semRMons.map(m=>({m,weeks:[1,2,3,4,5,6]})));
  }
  const yearActual=calcActual(rMonths.map(m=>({m,weeks:[1,2,3,4,5,6]})));

  const wb=XLSX.utils.book_new();

  // ── A様式シート ──
  const monthCols=MONTH_ORDER.filter(m=>rMonths.includes(m));
  const semsList=['1','2','3'];

  // ヘッダー行
  const hdr1=['内容等','年間実績','年間予定','年間過不足'];
  const hdr2=['','','',''];
  for(const m of monthCols){hdr1.push(`${m}月`);hdr2.push('');}
  for(const sem of semsList){
    const sl=SEMS[sem].label;
    hdr1.push(`${sl}実績`);if(showMod)hdr1.push('うちモ');
    hdr1.push(`${sl}予定`);if(showMod)hdr1.push('うちモ');
    hdr1.push(`${sl}過不足`);
    hdr2.push('');if(showMod)hdr2.push('');
    hdr2.push('');if(showMod)hdr2.push('');
    hdr2.push('');
  }

  const aAoa=[
    [`令和${S.year-2018}年度　月別授業実施時数一覧表（第${grade}）`,...Array(hdr1.length-1).fill('')],
    [`${schoolName}　${grade}${cls}　担任：${teacher}`,...Array(hdr1.length-1).fill('')],
    hdr1,
  ];

  for(const t of ts){
    const pl=planForTarget(t);
    const yAct=yearActual[t]?.tot||0;
    const yPlan=pl.planTotal;
    const row=[t,fmtN(yAct)||0,yPlan||0,yPlan?(yAct-yPlan):0];
    for(const m of monthCols){
      row.push(rMonths.includes(m)?(monthActual[m]?.[t]?.tot||0):0);
    }
    for(const sem of semsList){
      const sAct=semActual[sem]?.[t]?.tot||0;
      const sModAct=semActual[sem]?.[t]?.modTime||0;
      const sPlan=bySem[t][sem];
      const sModPlan=modBySem[t][sem];
      row.push(sAct);if(showMod)row.push(sModAct);
      row.push(sPlan);if(showMod)row.push(sModPlan);
      row.push(sPlan?sAct-sPlan:0);
    }
    aAoa.push(row);
  }
  // 合計行
  const ftRow=['合計',
    ts.reduce((s,t)=>s+(yearActual[t]?.tot||0),0),
    ts.reduce((s,t)=>s+(planForTarget(t).planTotal||0),0),
    ''
  ];
  for(const m of monthCols){
    ftRow.push(rMonths.includes(m)?ts.reduce((s,t)=>s+(monthActual[m]?.[t]?.tot||0),0):0);
  }
  for(const sem of semsList){
    const sa=ts.reduce((s,t)=>s+(semActual[sem]?.[t]?.tot||0),0);
    const sma=ts.reduce((s,t)=>s+(semActual[sem]?.[t]?.modTime||0),0);
    const sp=ts.reduce((s,t)=>s+(bySem[t][sem]||0),0);
    const smp=ts.reduce((s,t)=>s+(modBySem[t][sem]||0),0);
    ftRow.push(sa);if(showMod)ftRow.push(sma);
    ftRow.push(sp);if(showMod)ftRow.push(smp);
    ftRow.push(sp?sa-sp:0);
  }
  aAoa.push(ftRow);
  const wsA=XLSX.utils.aoa_to_sheet(aAoa);
  XLSX.utils.book_append_sheet(wb,wsA,'年間集計');

  // ── 月別シート ──
  const activeMons=rMonths.filter(m=>{
    const act=calcMonth(m);return ts.some(t=>(act[t]?.tot||0)>0);
  });
  for(const m of activeMons){
    const act=calcMonth(m);
    const sem=semOf(m);
    // semActはrMonths範囲内のみ集計
    const semRMonsX=SEMS[sem].months.filter(mx=>rMonths.includes(mx));
    const semAct=calcActual(semRMonsX.map(mx=>({m:mx,weeks:[1,2,3,4,5,6]})));
    const validWks=validWeeksForMonth(m);
    const sl=SEMS[sem].label;

    const mHdr=['内容等','年間実績','年間予定','年間過不足'];
    for(const w of validWks) mHdr.push(`第${w}週`);
    mHdr.push('月計');if(showMod)mHdr.push('うちモ');
    mHdr.push(`${sl}実績`);if(showMod)mHdr.push('うちモ');
    mHdr.push(`${sl}予定`);if(showMod)mHdr.push('うちモ');
    mHdr.push(`${sl}過不足`);

    const mAoa=[
      [`令和${S.year-2018}年度　月別授業実施時数一覧表（第${grade}）`,...Array(mHdr.length-1).fill('')],
      [`${schoolName}　${grade}${cls}　担任：${teacher}`,...Array(mHdr.length-1).fill('')],
      mHdr
    ];
    const yearActualFull=calcYear();
    for(const t of ts){
      const pl=planForTarget(t);
      const yAct=yearActualFull[t]?.tot||0;
      const yPlan=pl.planTotal;
      const mAct=act[t]?.tot||0;
      const mModAct=act[t]?.modTime||0;
      const sAct=semAct[t]?.tot||0;
      const sModAct=semAct[t]?.modTime||0;
      const sPlan=bySem[t][sem];
      const sModPlan=modBySem[t][sem];
      const row=[t,fmtN(yAct)||0,yPlan||0,yPlan?yAct-yPlan:0];
      for(const w of validWks){
        row.push(calcWeek(m,w)[t]?.tot||0);
      }
      row.push(mAct);if(showMod)row.push(mModAct);
      row.push(sAct);if(showMod)row.push(sModAct);
      row.push(sPlan);if(showMod)row.push(sModPlan);
      row.push(sPlan?sAct-sPlan:0);
      mAoa.push(row);
    }
    const wsM=XLSX.utils.aoa_to_sheet(mAoa);
    XLSX.utils.book_append_sheet(wb,wsM,`${m}月`);
  }

  const fname=`${S.year}年度_${cls}_授業実施時数レポート_${untilMonth}月末.xlsx`;
  XLSX.writeFile(wb,fname);
}

function init(){
  const td=new Date();
  document.getElementById('hd-today').textContent=`${td.getFullYear()}年${td.getMonth()+1}月${td.getDate()}日`;
  initYearSel();
  document.getElementById('inp-class').value=S.cls||'';
  document.getElementById('inp-teacher').value=S.teacher||'';
  document.getElementById('inp-school').oninput=e=>{S.schoolName=e.target.value;updateSchoolNameWarn();save();};
  document.getElementById('inp-class').oninput=e=>{S.cls=e.target.value;save();};
  document.getElementById('inp-teacher').oninput=e=>{S.teacher=e.target.value;save();};
  // ヘッダーボタン
  document.getElementById('btn-save-file').onclick=()=>saveToFile();
  document.getElementById('btn-open-file').onclick=()=>loadFromFile();
  document.getElementById('btn-print').onclick=()=>printWeek();
  document.getElementById('btn-print-student').onclick=()=>printForStudents();
  document.getElementById('btn-prev-week').onclick=()=>prevWeekNav();
  document.getElementById('btn-today').onclick=()=>gotoToday();
  document.getElementById('btn-next-week').onclick=()=>nextWeekNav();
  initResizer();
  document.getElementById('mb-reload').onclick=()=>{hideMismatchBanner();loadFromFile();};
  document.getElementById('mb-continue').onclick=()=>dimMismatchBanner();
  // セムバー
  document.querySelectorAll('.stab').forEach(t=>{
    t.onclick=()=>{
      const v=t.dataset.view;
      document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));
      t.classList.add('on');
      if(v==='cfg') showView('cfg');
      else if(v==='year') showView('year');
      else{curSem=t.dataset.sem;showView('sem');setSem(curSem);}
    };
  });
  // 設定サブタブ
  document.querySelectorAll('.ctab').forEach(b=>b.onclick=()=>{curCfgTab=b.dataset.ct;renderCfg();});
  // 月曜日付（手動上書き）
  document.getElementById('wdate').onchange=e=>{
    if(e.target.value) setWDate(curMonth,curWeek,e.target.value);
    else{
      const y=mYear(curMonth);
      if(db[y]?.[curMonth]?.[curWeek]) delete db[y][curMonth][curWeek]._date;
      save();
    }
    refreshWbar();renderTT();
  };
  // 時数タブ（期間）
  document.querySelectorAll('.jtab').forEach(t=>t.onclick=()=>{
    jisuuTab=t.dataset.jt;
    document.querySelectorAll('.jtab').forEach(x=>x.classList.toggle('on',x===t));
    renderJisuu();
  });
  // 時数サブタブ（集計方法）
  document.querySelectorAll('.jsubtab').forEach(t=>t.onclick=()=>{
    jisuuSubTab=t.dataset.jst;
    document.querySelectorAll('.jsubtab').forEach(x=>x.classList.toggle('on',x===t));
    renderJisuu();
  });
  // パターンメニュー
  const psBtn=document.getElementById('psave-btn'),psSm=document.getElementById('psave-menu');
  const plBtn=document.getElementById('pload-btn'),plSm=document.getElementById('pload-menu');
  psBtn.onclick=e=>{e.stopPropagation();psSm.style.display=psSm.style.display==='none'?'block':'none';plSm.style.display='none';};
  plBtn.onclick=e=>{e.stopPropagation();plSm.style.display=plSm.style.display==='none'?'block':'none';psSm.style.display='none';};
  document.addEventListener('click',()=>{psSm.style.display='none';plSm.style.display='none';});
  // モーダル
  document.getElementById('modal-bg').onclick=e=>{if(e.target===e.currentTarget)closeModal();};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeModal();
    if(e.key==='Enter'&&!e.shiftKey&&document.getElementById('modal-bg').classList.contains('on')){e.preventDefault();saveModal();}
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveToFile();}
    if(e.key==='Shift') window._scheduleShiftDown=true;
  });
  // Shiftキー状態追跡（行事予定スケジュール表の範囲選択用・init()で一度だけ登録）
  window._scheduleShiftDown=false;
  document.addEventListener('keyup',e=>{if(e.key==='Shift') window._scheduleShiftDown=false;});
  // 未保存時のタブ閉じ警告
  window.addEventListener('beforeunload',e=>{
    if(appStarted&&hasUnsavedChanges){
      e.preventDefault();
      e.returnValue=''; // Chrome要件
    }
  });
  // 起動画面ボタン
  document.getElementById('startup-load').onclick=()=>loadFromFile();
  document.getElementById('startup-new').onclick=()=>enterApp();
  // まず起動画面を表示（launchQueueがファイルを渡してきた場合に上書き）
  showStartupScreen();
  // ─── File Handling API：データファイルのダブルクリック起動対応 ───
  if('launchQueue' in window){
    window.launchQueue.setConsumer(async launchParams=>{
      if(!launchParams.files||launchParams.files.length===0) return; // ファイルなし→起動画面のまま
      try{
        const fh=launchParams.files[0];
        const file=await fh.getFile();
        const text=await file.text();
        applyJsonData(text,fh); // 成功時はapplyJsonData内でenterApp()が呼ばれる
      }catch(e){
        console.warn('File Handling API error:',e);
        // 失敗時は起動画面のまま
      }
    });
  }
}
init();

// ─── Service Worker 登録（PWA RC2）────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
