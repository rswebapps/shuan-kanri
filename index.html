// ─── KOURY BADGES ────────────────────────────────────────────────
// デフォルト計算：転出児童は除外（新規コマには自動で立たない）
function kBadgesDefault(subjSet){
  if(!subjSet.size) return new Set();
  const mode=S.koury.mode;
  const shown=new Set();
  for(const ch of S.koury.children){
    if(!ch.active||ch.tenshutsu) continue;
    let show=false;
    // 通常学級・専科：交流教科に一致する児童を表示
    if(mode==='normal'||mode==='senka'){
      for(const s of subjSet){if(ch.subjects.includes(s)){show=true;break;}}
    } else {
      // 特別支援学級：交流に行かない（在籍中の）コマで表示
      let inEx=false;for(const s of subjSet){if(ch.subjects.includes(s)){inEx=true;break;}}show=!inEx;
    }
    if(show) shown.add(ch.id);
  }
  return shown;
}
// コマ単位の上書きを反映したバッジ一覧
// 転出児童：明示的にtrue保存されている過去データのみ表示、デフォルトでは立てない
function kBadgesForCell(s1, s2, koury1, koury2){
  const activeChildren=S.koury.children.filter(ch=>ch.active);
  if(!activeChildren.length) return [];
  const def1=kBadgesDefault(new Set([s1].filter(Boolean)));
  const def2=kBadgesDefault(new Set([s2].filter(Boolean)));
  const res=[];
  for(const ch of activeChildren){
    // 転出児童：上書きが明示的にtrueの場合のみ表示、それ以外はfalse
    const fallback1=ch.tenshutsu?false:def1.has(ch.id);
    const fallback2=ch.tenshutsu?false:def2.has(ch.id);
    const k1=(koury1&&koury1[ch.id]!==undefined)?koury1[ch.id]:fallback1;
    const k2=(koury2&&koury2[ch.id]!==undefined)?koury2[ch.id]:fallback2;
    if(k1||k2) res.push(ch);
  }
  return res;
}
// 後方互換用
function kBadges(subjSet){return kBadgesForCell([...subjSet][0]||'',[...subjSet][1]||'',null,null);}
// 1教科分のバッジ一覧（転出児童：明示上書きのみ表示）
function kBadgesForSubject(subj, koury){
  const activeChildren=S.koury.children.filter(ch=>ch.active);
  if(!activeChildren.length) return [];
  const def=kBadgesDefault(new Set([subj].filter(Boolean)));
  return activeChildren.filter(ch=>{
    const fallback=ch.tenshutsu?false:def.has(ch.id);
    const k=(koury&&koury[ch.id]!==undefined)?koury[ch.id]:fallback;
    return k;
  });
}

// ─── 【1-3/1-4】テーブル行構成ビルダー ───────────────────────────
// 授業スロット・メモ行・週メモ行の表示順を返す
function buildRenderOrder(vsl){
  const order=[];

  // 行事行：朝メモ行の上に日別で常時表示
  order.push({type:'schedule',label:'行事',hdCls:'schedule-hd',cellCls:'schedule-cell',perDay:true});
  // ① 朝メモ行：朝モスロットの有効無効に関わらず常時表示
  order.push({type:'memo',key:'asa',label:'朝',hdCls:'',cellCls:'',perDay:true});

  for(const sl of vsl){
    if(sl.id==='gyoukan'){
      order.push({type:'memo',key:'gyoukan',label:'業間',hdCls:'',cellCls:'',perDay:true});
      continue;
    }
    order.push({type:'slot',sl});
    if(sl.id==='4'){
      order.push({type:'memo',key:'lunch',label:'昼休み',hdCls:'',cellCls:'',perDay:true});
    }
  }
  order.push({type:'memo',key:'leave',label:'下校',hdCls:'leave-hd',cellCls:'leave-cell',perDay:true});
  order.push({type:'memo',key:'hw',label:'宿題',hdCls:'hw-hd',cellCls:'hw-cell',perDay:true});
  order.push({type:'memo',key:'renraku',label:'連絡',hdCls:'renraku-hd',cellCls:'renraku-cell',tall:true,perDay:true});
  order.push({type:'week',key:'weekly_aim',label:'週めあて',hdCls:'aim-hd',cellCls:'aim-cell'});
  order.push({type:'week',key:'notice',label:'おしらせ',hdCls:'notice-hd',cellCls:'notice-cell',tall:true,printStudent:true});
  for(let i=0;i<5;i++){
    order.push({type:'note',idx:i,label:`校内メモ${i+1}`,hdCls:'note-hd',cellCls:'note-cell',noteRow:true});
  }
  return order;
}

// 日付文字列と曜日キーから、その日が「アクティブ」になる (month, week) を返す
// 非アクティブ日（月またぎ）のデータ取得に使用
function findCellLocationForDate(isoDate,dk){
  const dt=new Date(isoDate);
  const month=dt.getMonth()+1;
  const year=dt.getFullYear();
  const acYear=month>=4?year:year-1;
  for(let w=1;w<=6;w++){
    if(!isValidWeek(acYear,month,w)) continue;
    const monday=calcMonday(acYear,month,w);
    const cellDt=new Date(monday);
    cellDt.setDate(cellDt.getDate()+DAY_OFFSETS[dk]);
    if(localDateStr(cellDt)===isoDate) return{month,week:w};
  }
  return null;
}

// ─── TIMETABLE ───────────────────────────────────────────────────
function renderTT(){
  const vsl=visSlots();
  const vdk=visibleDKeys();
  const mondayStr=getEffectiveMonday(curMonth,curWeek);
  const memos=getWeekMemos(curMonth,curWeek);

  // 曜日ごとの日付文字列とアクティブ判定を事前計算
  const dkDate={};   // dk → "YYYY-MM-DD"
  const dkActive={}; // dk → この月に属するか
  vdk.forEach(dk=>{
    if(mondayStr){
      const dt=new Date(mondayStr);
      dt.setDate(dt.getDate()+DAY_OFFSETS[dk]);
      const iso=localDateStr(dt);
      dkDate[dk]=iso;
      dkActive[dk]=(dt.getMonth()+1===curMonth);
      // confが読み込まれている場合、祝日・休業日は非アクティブに上書き
      if(dkActive[dk] && isDayInactive(iso)) dkActive[dk]=false;
    } else {
      dkDate[dk]=null;
      dkActive[dk]=true;
    }
  });
  // 非アクティブ日のデータ取得先 (month,week) を事前解決
  const dkCellLoc={}; // dk → {month,week} or null
  vdk.forEach(dk=>{
    if(dkActive[dk]){
      dkCellLoc[dk]={month:curMonth,week:curWeek};
    } else {
      const iso=dkDate[dk];
      dkCellLoc[dk]=iso?findCellLocationForDate(iso,dk):null;
    }
  });

  // ヘッダー行（日〜土順）
  let hh=`<tr><th class="th-sl">時間</th>`;
  vdk.forEach(dk=>{
    const lbl=DAY_LABELS[dk];
    const iso=dkDate[dk];
    const inactive=!dkActive[dk];  // ブロック外で定義
    let ds='';
    if(iso){
      const dt=new Date(iso);
      ds=`<br><small style="font-weight:400;opacity:${inactive?.5:.85}">${dt.getMonth()+1}/${dt.getDate()}</small>`;
    }
    const xCls=dk==='sat'?' th-sat':dk==='sun'?' th-sun':'';
    const inactiveAttr=inactive?' data-inactive="1"':'';
    hh+=`<th class="th-dy${xCls}"${inactiveAttr}>${lbl}曜日${ds}</th>`;
  });
  document.getElementById('tth').innerHTML=hh+'</tr>';

  // テーブル本体
  const order=buildRenderOrder(vsl);
  let rows='';

  for(const item of order){
    // ─ 週単位メモ行（notes：校内メモ1〜5）─
    if(item.type==='note'){
      const key=`note_${item.idx}`;
      const val=memos.notes[item.idx]||'';
      rows+=`<tr class="note-row">
        <td class="memo-hd ${item.hdCls}">${item.label}</td>
        <td class="memo-cell ${item.cellCls}" colspan="${vdk.length}">
          <textarea data-memokey="${key}" style="height:20px">${escHtml(val)}</textarea>
        </td>
      </tr>`;
      continue;
    }
    // ─ 行事行（S.scheduleから日付キーで取得）─
    if(item.type==='schedule'){
      rows+=`<tr><td class="memo-hd ${item.hdCls}" title="全角スペースで改行（印刷時）">${item.label}</td>`;
      for(const dk of vdk){
        const active=dkActive[dk];
        const iso=dkDate[dk];
        const val=iso?(S.schedule[iso]||''):'';
        if(!active){
          rows+=`<td class="memo-cell ${item.cellCls}" style="background:#ebebeb;opacity:.5"></td>`;
        } else {
          rows+=`<td class="memo-cell ${item.cellCls}" data-dk="${dk}">
            <textarea class="schedule-ta" data-isodate="${iso}" data-dk="${dk}"
              placeholder="全角スペースで改行"
              style="width:100%;border:none;background:transparent;font-family:inherit;font-size:11px;resize:none;padding:1px 3px;outline:none;color:var(--text);min-height:20px;overflow:hidden"
            >${escHtml(val)}</textarea></td>`;
        }
      }
      rows+='</tr>';
      continue;
    }
    // ─ 週ブチ抜き行（週めあて・おしらせ）─
    if(item.type==='week'){
      const val=memos[item.key]||'';
      const h=item.tall?'36px':'20px';
      rows+=`<tr>
        <td class="memo-hd ${item.hdCls}">${item.label}</td>
        <td class="memo-cell ${item.cellCls}" colspan="${vdk.length}">
          <textarea data-memokey="${item.key}" style="height:${h}">${escHtml(val)}</textarea>
        </td>
      </tr>`;
      continue;
    }
    // ─ 日別メモ行（朝/業間/昼休み/下校/宿題連絡）─
    if(item.type==='memo'&&item.perDay){
      const h=item.tall?'36px':'20px';
      rows+=`<tr><td class="memo-hd ${item.hdCls}">${item.label}</td>`;
      for(const dk of vdk){
        const active=dkActive[dk];
        const loc=dkCellLoc[dk];
        const effectiveMemos=active?memos:(loc?getWeekMemos(loc.month,loc.week):null);
        const val=(effectiveMemos?.[item.key]?.[dk])||'';
        if(!active){
          if(val){
            rows+=`<td class="memo-cell ${item.cellCls}" style="opacity:.5"><div style="font-size:11px;padding:2px 3px;white-space:pre-line;color:var(--text)">${escHtml(val)}</div></td>`;
          } else {
            rows+=`<td class="memo-cell ${item.cellCls}" style="background:#ebebeb;opacity:.5"></td>`;
          }
        } else {
          rows+=`<td class="memo-cell ${item.cellCls}" data-dk="${dk}"><textarea data-memokey="${item.key}" data-dk="${dk}" style="height:${h}">${escHtml(val)}</textarea></td>`;
        }
      }
      rows+='</tr>';
      continue;
    }
    // ─ スロット行 ─
    const sl=item.sl;
    const isMod=sl.base==='mod',isFull=sl.base==='full',isNone=sl.base==='none';
    const slCls=sl.id==='asa'?'asa':sl.id==='gyoukan'?'gyo':sl.id==='hiru'?'hiru':sl.id==='owari'?'owari':'';
    const slLbl=isFull?sl.label+'時間目':isMod?`${sl.label}<br><small>1/${sl.modN}単位</small>`:sl.label;
    rows+=`<tr><td class="sltd ${slCls}">${slLbl}</td>`;
    for(const dk of vdk){
      const active=dkActive[dk];
      if(isNone){
        rows+=`<td class="cell nocount"><div class="cin" style="justify-content:center;align-items:center"><span style="font-size:10px;color:#ccc">${sl.label}</span></div></td>`;
        continue;
      }
      // 非アクティブセル（月またぎ：当該月外の日付）
      if(!active){
        const loc=dkCellLoc[dk];
        const c=loc?getCell(loc.month,loc.week,sl.id,dk):{s1:'',m1:'',s2:'',m2:''};
        if(!c.s1){
          rows+=`<td class="cell inactive"><div class="cin" style="justify-content:center;align-items:center"><span style="font-size:10px;color:#bbb">―</span></div></td>`;
        } else {
          const col1=sColor(c.s1);
          let inner=`<div class="srow"><span class="sname" style="color:${col1}">${c.s1}</span></div>`;
          if(c.m1) inner+=`<div class="cmemo">${escHtml(c.m1)}</div>`;
          if(c.s2){
            const col2=sColor(c.s2);
            inner+=`<div class="csep"></div><div class="srow"><span class="sname" style="color:${col2}">${c.s2}</span></div>`;
            if(c.m2) inner+=`<div class="cmemo">${escHtml(c.m2)}</div>`;
          }
          rows+=`<td class="cell inactive"><div class="cin">${inner}</div></td>`;
        }
        continue;
      }
      const c=getCell(curMonth,curWeek,sl.id,dk);
      const has2=!!c.s2;
      // 教科ごとに独立してバッジを計算
      const badges1=kBadgesForSubject(c.s1||'', c.koury1||null);
      const badges2=has2?kBadgesForSubject(c.s2||'', c.koury2||null):[];
      const kbHtml=bs=>bs.map(b=>`<span class="kbadge" style="background:${b.color}" title="${b.id}児童">${b.id}</span>`).join('');
      let inner='';
      if(!c.s1){
        inner='<span class="cempty">＋</span>';
      } else {
        const col1=sColor(c.s1);
        let b1='';
        if(isMod) b1=`<span class="tbadge tb-m">1/${sl.modN}</span>`;
        else if(has2){const r1=c.ratio1??0.5;b1=`<span class="tbadge tb-h">${r1}</span>`;}
        // 教科1名 + 単位バッジ（右端）
        inner+=`<div class="srow"><span class="sname" style="color:${col1}">${c.s1}</span>${b1}</div>`;
        // 教科1のバッジ（名前行の直下）
        if(badges1.length) inner+=`<div class="cbadges-sub">${kbHtml(badges1)}</div>`;
        if(c.m1) inner+=`<div class="cmemo">${escHtml(c.m1)}</div>`;
        if(has2){
          const col2=sColor(c.s2);
          inner+=`<div class="csep"></div>`;
          // 教科2名 + ½バッジ（右端）
          inner+=`<div class="srow"><span class="sname" style="color:${col2}">${c.s2}</span><span class="tbadge tb-h">${Math.round((1-(c.ratio1??0.5))*100)/100}</span></div>`;
          // 教科2のバッジ（名前行の直下）
          if(badges2.length) inner+=`<div class="cbadges-sub">${kbHtml(badges2)}</div>`;
          if(c.m2) inner+=`<div class="cmemo">${escHtml(c.m2)}</div>`;
        }
      }
      rows+=`<td class="cell" data-sl="${sl.id}" data-dk="${dk}"><div class="cin">${inner}</div></td>`;
    }
    rows+='</tr>';
  }
  document.getElementById('ttb').innerHTML=rows;

  // 授業セルのクリックイベント（inactive は除外）
  document.querySelectorAll('td.cell:not(.nocount):not(.inactive)').forEach(td=>{
    td.addEventListener('click',()=>openModal(td.dataset.sl,td.dataset.dk));
  });

  // 行事テキストエリアの保存イベント
  document.querySelectorAll('textarea[data-scheduledate]').forEach(ta=>{
    autoGrowTA(ta);
    ta.addEventListener('input',()=>{
      autoGrowTA(ta);
      const d=ta.dataset.scheduledate;
      if(d){S.schedule[d]=ta.value;save();}
    });
  });
  // メモテキストエリアの保存イベント
  document.querySelectorAll('textarea[data-memokey]').forEach(ta=>{
    autoGrowTA(ta);
    ta.addEventListener('input',()=>{
      autoGrowTA(ta);
      setWeekMemo(curMonth,curWeek,ta.dataset.memokey,ta.value,ta.dataset.dk||null);
    });
  });
  // メモセルキーボードナビゲーション
  addMemoNavigation();
  // ─ 行事行 textarea（週案タブから直接編集）─
  document.querySelectorAll('textarea.schedule-ta').forEach(ta=>{
    autoGrowTA(ta);
    ta.addEventListener('input',()=>{
      autoGrowTA(ta);
      const iso=ta.dataset.isodate;
      if(iso) S.schedule[iso]=ta.value;
      save();
    });
  });
}


// ─── メモセルキーボードナビゲーション ────────────────────────────
function addMemoNavigation(){
  // 群①: 日別メモ（下校・宿題・連絡）
  const G1_KEYS=['leave','hw','renraku'];
  // 群②: 週単位メモ（週めあて・おしらせ・校内メモ1〜5）
  const G2_KEYS=['weekly_aim','notice','note_0','note_1','note_2','note_3','note_4'];

  // 群①のtextareaをキー×dk の2次元マップで保持
  const g1map={}; // g1map[key][dk] = textarea
  G1_KEYS.forEach(k=>{ g1map[k]={}; });
  document.querySelectorAll('textarea[data-memokey]').forEach(ta=>{
    const k=ta.dataset.memokey, dk=ta.dataset.dk;
    if(G1_KEYS.includes(k)&&dk) g1map[k][dk]=ta;
  });

  // 群②のtextareaをキー順配列で保持
  const g2list=[];
  G2_KEYS.forEach(k=>{
    const ta=document.querySelector(`textarea[data-memokey="${k}"]`);
    if(ta) g2list.push(ta);
  });

  // 表示中の曜日キー順（左→右）
  const dkOrder=[...document.querySelectorAll('#tth th[class*="th-dy"]')]
    .map(th=>th.dataset?.dk).filter(Boolean);
  // th に data-dk が無い場合、visibleDKeys() を代替に使う
  const vdks=Object.keys(g1map['leave']||{});

  // 最後にフォーカスしていた群①の dk を記憶
  let lastG1Dk=null;

  // 群①ナビ
  G1_KEYS.forEach((key,ki)=>{
    Object.entries(g1map[key]).forEach(([dk,ta])=>{
      ta.addEventListener('focus',()=>{ lastG1Dk=dk; });
      ta.addEventListener('keydown',e=>{
        const shift=e.shiftKey;
        if(e.key==='Tab'||e.key==='Enter'){
          e.preventDefault();
          if(shift){
            // 上へ：同dk・前のキー
            if(ki>0){
              const prev=g1map[G1_KEYS[ki-1]][dk];
              if(prev) prev.focus();
            }
          } else {
            // 下へ：同dk・次のキー or 群②先頭
            if(ki<G1_KEYS.length-1){
              const next=g1map[G1_KEYS[ki+1]][dk];
              if(next) next.focus();
            } else {
              if(g2list[0]) g2list[0].focus();
            }
          }
        } else if(e.key==='ArrowLeft'){
          // 前の曜日（同じキー）
          const dks=Object.keys(g1map[key]);
          const idx=dks.indexOf(dk);
          if(idx>0){ e.preventDefault(); g1map[key][dks[idx-1]].focus(); }
        } else if(e.key==='ArrowRight'){
          // 次の曜日（同じキー）
          const dks=Object.keys(g1map[key]);
          const idx=dks.indexOf(dk);
          if(idx<dks.length-1){ e.preventDefault(); g1map[key][dks[idx+1]].focus(); }
        } else if(e.key==='ArrowDown'){
          e.preventDefault();
          if(ki<G1_KEYS.length-1){
            // 同dk・次の群①行
            const next=g1map[G1_KEYS[ki+1]][dk];
            if(next) next.focus();
          } else {
            // 連絡行の末尾→群②先頭
            if(g2list[0]) g2list[0].focus();
          }
        } else if(e.key==='ArrowUp'){
          e.preventDefault();
          if(ki>0){
            // 同dk・前の群①行
            const prev=g1map[G1_KEYS[ki-1]][dk];
            if(prev) prev.focus();
          } else {
            // 下校行の先頭→群②末尾
            const last=g2list[g2list.length-1];
            if(last) last.focus();
          }
        }
      });
    });
  });

  // 群②ナビ
  g2list.forEach((ta,gi)=>{
    ta.addEventListener('keydown',e=>{
      const shift=e.shiftKey;
      if(e.key==='Tab'||e.key==='Enter'){
        e.preventDefault();
        if(shift){
          // 上へ：前の群②要素 or 群①連絡行（直前dk）
          if(gi>0){ g2list[gi-1].focus(); }
          else {
            const dk=lastG1Dk||Object.keys(g1map['renraku'])[0];
            const prev=g1map['renraku'][dk];
            if(prev) prev.focus();
          }
        } else {
          // 下へ：次の群②要素 or 群①下校行（直前dk）
          if(gi<g2list.length-1){ g2list[gi+1].focus(); }
          else {
            const dk=lastG1Dk||Object.keys(g1map['leave'])[0];
            const next=g1map['leave'][dk];
            if(next) next.focus();
          }
        }
      } else if(e.key==='ArrowUp'){
        // 群②内↑：前の要素 or 群①連絡行
        if(gi>0){ e.preventDefault(); g2list[gi-1].focus(); }
        else {
          e.preventDefault();
          const dk=lastG1Dk||Object.keys(g1map['renraku'])[0];
          const t=g1map['renraku'][dk];
          if(t) t.focus();
        }
      } else if(e.key==='ArrowDown'){
        // 群②内↓：次の要素 or 群①下校行
        if(gi<g2list.length-1){ e.preventDefault(); g2list[gi+1].focus(); }
        else {
          e.preventDefault();
          const dk=lastG1Dk||Object.keys(g1map['leave'])[0];
          const t=g1map['leave'][dk];
          if(t) t.focus();
        }
      }
    });
  });
}

function autoGrowTA(ta){
  ta.style.height='auto';
  ta.style.height=(ta.scrollHeight)+'px';
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 教科が変わったとき koury のデフォルト値を再計算してチェックボックスUIに反映
function refreshKouryUI(which){
  // which=1 → koury1 を再計算、which=2 → koury2 を再計算
  const s=which===1?mstate.s1:mstate.s2;
  const key=`koury${which}`;
  const defaultShown=kBadgesDefault(new Set([s].filter(Boolean)));
  S.koury.children.filter(ch=>ch.active&&!ch.tenshutsu).forEach(ch=>{
    const checked=defaultShown.has(ch.id);
    mstate[key][ch.id]=checked;
    const cb=document.querySelector(`.koury-cb[data-which="${which}"][data-kid="${ch.id}"]`);
    const lbl=document.querySelector(`.koury-check-item[data-which="${which}"][data-kid="${ch.id}"]`);
    if(cb) cb.checked=checked;
    if(lbl){
      lbl.style.background=checked?ch.color:'#fff';
      lbl.style.color=checked?'#fff':ch.color;
    }
  });
}

// ─── JISUU PANEL ─────────────────────────────────────────────────
function renderJisuu(){
  const totalWks=S.yearTotalWeeks||35;
  const ts=targets();

  // 期間タブによる実績・経過週数の決定
  let actual,periodWeeks;
  if(jisuuTab==='week'){
    actual=calcWeek(curMonth,curWeek);
    periodWeeks=1;
  } else if(jisuuTab==='month'){
    actual=calcCumMonth();
    // 月計：その月の全有効週数を分母にする
    periodWeeks=validWeeksForPlan(curMonth).length;
  } else if(jisuuTab==='sem'){
    actual=calcCumSem();
    // 学期：その学期の全有効週数を分母にする
    periodWeeks=validWeekCountForMonths(SEMS[curSem].months);
  } else {
    actual=calcCumulative();
    // 年度：年間総週数を分母にする
    periodWeeks=totalWks;
  }

  // 凡例：時数タブのみ表示
  document.getElementById('jleg').style.display=jisuuSubTab==='count'?'flex':'none';

  let html='';

  // ─ 時数テーブル ─
  if(jisuuSubTab==='count'){
    let rows='';let tf=0,th=0,tm=0,tt=0;
    const showMod=hasActiveMod();
    ts.forEach(t=>{
      const d=actual[t]||{full:0,half:0,mod:0,tot:0};
      tf+=d.full;th+=d.half;tm+=d.modTime||0;tt+=d.tot;
      const col=SCOLORS[t]||'#444';
      const pl=planForTarget(t);
      const exp=pl.planTotal*(periodWeeks/totalWks);
      const diff=d.tot-exp;
      const dcls=Math.abs(diff)<0.005?'jz':diff>0?'jpos':'jneg';
      const modCell=showMod?`<td class="${(d.modTime||0)?'jm':'jz'}">${fmtN(d.modTime)||'-'}</td>`:'';
      rows+=`<tr>
        <td style="color:${col}">${t}</td>
        <td class="${d.full?'jf':'jz'}">${d.full||'-'}</td>
        <td class="${d.half?'jh':'jz'}">${d.half||'-'}</td>
        ${modCell}
        <td class="jt2">${fmtN(d.tot)||'-'}</td>
        <td class="jp">${fmtN(exp)||'-'}</td>
        <td class="${dcls}">${fmtDiff(diff)}</td>
      </tr>`;
    });
    const modHd=showMod?`<th style="color:var(--col-mod)">モ</th>`:'';
    const modFt=showMod?`<td class="jm">${fmtNz(tm)}</td>`:'';
    html=`<table class="jt">
      <thead><tr>
        <th>教科</th>
        <th style="color:var(--col-full)">フル</th>
        <th style="color:var(--col-half)">½</th>
        ${modHd}
        <th>計</th><th class="jp">計画</th><th>差</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td>合計</td>
        <td class="jf">${fmtNz(tf)}</td><td class="jh">${fmtNz(th)}</td>
        ${modFt}<td class="jt2">${fmtNz(tt)}</td>
        <td colspan="2"></td>
      </tr></tfoot>
    </table>`;

  } else if(jisuuSubTab==='plan'){
    let rows='';
    const showMod=hasActiveMod();
    ts.forEach(t=>{
      const d=actual[t]||{full:0,half:0,mod:0,tot:0};
      const pl=planForTarget(t);
      const nonMod=d.full+d.half*0.5;
      const modVal=d.tot-nonMod;
      const rNonMod=calcRate(nonMod, pl.planFull,  periodWeeks, totalWks);
      const rMod   =calcRate(modVal,  pl.planMod,   periodWeeks, totalWks);
      const rTotal =calcRate(d.tot,   pl.planTotal, periodWeeks, totalWks);
      const col=SCOLORS[t]||'#444';
      const c=(v,r)=>r!==null?`<td class="${rateCls(r)}">${fmtRate(r)}</td>`:`<td class="jz">-</td>`;
      const modCell=showMod?c(modVal,rMod):'';
      rows+=`<tr>
        <td style="color:${col}">${t}</td>
        ${c(nonMod,rNonMod)}${modCell}${c(d.tot,rTotal)}
      </tr>`;
    });
    const modNote=showMod?' / モ=モジュール換算':'';
    const modHd=showMod?`<th>モ</th>`:'';
    const colSpan=showMod?3:2;
    html=`<div style="font-size:9px;color:var(--muted);margin-bottom:4px">
      モ外=フル+½換算${modNote} / 計=合計
    </div>
    <table class="jt">
      <thead>
        <tr><th>教科</th><th colspan="${colSpan}" style="text-align:center;color:#7b1fa2">計画比（%）</th></tr>
        <tr><th></th><th>モ外</th>${modHd}<th>計</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  // ─ 標準時数に対する実施率 ─
  } else {
    let rows='';
    ts.forEach(t=>{
      const d=actual[t]||{full:0,half:0,mod:0,tot:0};
      const pl=planForTarget(t);
      const rStd=calcRate(d.tot, pl.planStd, periodWeeks, totalWks);
      const col=SCOLORS[t]||'#444';
      // ★ 全教科表示（planStd=0なら「-」）
      rows+=`<tr>
        <td style="color:${col}">${t}</td>
        ${rStd!==null?`<td class="${rateCls(rStd)}">${fmtRate(rStd)}</td>`:'<td class="jz">-</td>'}
      </tr>`;
    });
    html=`<div style="font-size:9px;color:var(--muted);margin-bottom:4px">
      合計実績 ÷ 標準時数按分 × 100
    </div>
    <table class="jt">
      <thead>
        <tr><th>教科</th><th style="color:#7b1fa2">標準比（%）</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  document.getElementById('jbody').innerHTML=html;
  attachJisuuCopyHandlers();
}

// 列ヘッダークリックで列データをクリップボードにコピー
function attachJisuuCopyHandlers(){
  document.querySelectorAll('#jbody table').forEach(table=>{
    // 最終ヘッダー行のthを対象（2行ヘッダーでも最終行が列名）
    const lastHdrRow=table.querySelector('thead tr:last-child');
    if(!lastHdrRow) return;
    const ths=[...lastHdrRow.querySelectorAll('th')];
    ths.forEach((th,ci)=>{
      if(ci===0) return; // 教科列はスキップ
      th.classList.add('col-copyable');
      th.title='クリックでこの列をコピー（教科名＋値）';
      th.addEventListener('click',()=>{
        // tbody の ci 列を教科名（ci=0）と一緒に収集
        const rows=[...table.querySelectorAll('tbody tr')];
        const lines=rows.map(row=>{
          const cells=[...row.querySelectorAll('td')];
          if(!cells.length) return null;
          const subj=cells[0]?.textContent?.trim()||'';
          const val=cells[ci]?.textContent?.trim()||'';
          return subj?`${subj}\t${val}`:null;
        }).filter(Boolean);
        if(!lines.length) return;
        navigator.clipboard.writeText(lines.join('\n')).then(()=>{
          const orig=th.textContent;
          th.classList.add('col-copied');
          th.textContent='✓ コピー済';
          setTimeout(()=>{
            th.classList.remove('col-copied');
            th.textContent=orig;
          },1400);
        }).catch(()=>{
          // フォールバック：古いブラウザ用
          const ta=document.createElement('textarea');
          ta.value=lines.join('\n');
          ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          const orig=th.textContent;
          th.classList.add('col-copied');
          th.textContent='✓ コピー済';
          setTimeout(()=>{th.classList.remove('col-copied');th.textContent=orig;},1400);
        });
      });
    });
  });
}

// ─── 【1-1】MODAL（2教科バグ修正） ────────────────────────────────
// 修正方針：mstateをDOM操作の唯一の状態源とし、
//   selSubj1/2 の代わりに mstate.s1/s2 を直接更新する
function openModal(slotId,dk){
  const sl=S.slots.find(s=>s.id===slotId);if(!sl)return;
  const c=getCell(curMonth,curWeek,slotId,dk);
  const isMod=sl.base==='mod',isFull=sl.base==='full';
  const activeChildren=S.koury.children.filter(ch=>ch.active&&!ch.tenshutsu);
  const def1=kBadgesDefault(new Set([c.s1].filter(Boolean)));
  const initKoury1={};
  activeChildren.forEach(ch=>{
    const stored=c.koury1?.[ch.id];
    initKoury1[ch.id]=(stored!==undefined)?stored:def1.has(ch.id);
  });
  // koury2（教科2用）を初期化
  const def2=kBadgesDefault(new Set([c.s2].filter(Boolean)));
  const initKoury2={};
  activeChildren.forEach(ch=>{
    const stored=c.koury2?.[ch.id];
    initKoury2[ch.id]=(stored!==undefined)?stored:def2.has(ch.id);
  });
  mstate={
    slotId,dk,m:curMonth,w:curWeek,
    s1:c.s1||'',m1:c.m1||'',
    s2:c.s2||'',m2:c.m2||'',
    has2:!!c.s2,isMod,modN:sl.modN||3,isFull,
    ratio1:c.ratio1??0.5,  // 教科1の比率（デフォルト0.5）
    koury1:initKoury1, koury2:initKoury2
  };
  const dayLbl=DAY_LABELS[dk];
  const slLbl=isFull?sl.label+'時間目':isMod?`${sl.label}（1/${sl.modN}単位）`:sl.label;
  document.getElementById('mtitle').textContent=`${dayLbl}曜日 ${slLbl}`;
  renderMBody();
  document.getElementById('modal-bg').classList.add('on');
}

function renderMBody(){
  const{has2,isMod,modN,slotId}=mstate;
  // isFull は mstate に頼らず S.slots から直接取得（再レンダリング時の安全策）
  const slDef=S.slots.find(s=>s.id===slotId);
  const isFull=slDef?.base==='full';
  const classType=S.koury.mode==='normal'?'normal':'tokushi';
  // 学年・学級タイプに合わない教科はチップ非表示
  const slist=S.subjects
    .filter(s=>{const m=SUBJECT_MASTER.find(x=>x.label===s.label);return !m||isSubjectActive(m,S.grade,classType);})
    .map(s=>s.label);
  const activeChildren=S.koury.children.filter(ch=>ch.active);
  const modeNote=S.koury.mode==='normal'?'交流に来る児童':'在籍中の児童';

  function makeChips(which){
    const sel=which===1?mstate.s1:mstate.s2;
    return slist.map(s=>{
      const c=sColor(s),on=sel===s;
      return `<button class="chip" data-cid="${which}" data-s="${s}"
        style="color:${on?'#fff':c};border-color:${on?c:c+'55'};background:${on?c:'#fff'}">${s}</button>`;
    }).join('');
  }

  function makeKourySection(which){
    if(!activeChildren.length) return '';
    const key=`koury${which}`;
    const checks=activeChildren.map(ch=>{
      const checked=mstate[key]?.[ch.id]??false;
      return `<label class="koury-check-item" data-which="${which}" data-kid="${ch.id}"
          style="color:${checked?'#fff':ch.color};border-color:${ch.color};background:${checked?ch.color:'#fff'}">
        <input type="checkbox" class="koury-cb" data-which="${which}" data-kid="${ch.id}" ${checked?'checked':''}>
        ${ch.id}
      </label>`;
    }).join('');
    return `<div class="koury-modal-sec">
      <span class="koury-modal-lbl">${modeNote}</span>
      <div class="koury-checks">${checks}</div>
    </div>`;
  }

  function makeBlock(which){
    const sel=which===1?mstate.s1:mstate.s2;
    const mv=which===1?mstate.m1:mstate.m2;
    const r1=mstate.ratio1??0.5;
    const r2=Math.round((1-r1)*100)/100;
    const ratioVal=which===1?r1:r2;
    const lbl=which===1?(has2?`1教科目`:'教科'):`2教科目`;
    const lcls=which===1?'mcl1':'mcl2';
    const unitNote=isMod?`（1/${modN}単位）`:has2?`（${ratioVal}単位）`:'（1単位）';
    const ratioInput=has2&&which===1?`
      <div class="mf" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <label class="mfl" style="margin-bottom:0;white-space:nowrap">1教科目の比率</label>
        <input type="number" id="ratio1-inp" min="0.1" max="0.9" step="0.1"
          value="${r1}" style="width:70px;padding:4px 6px;border:1px solid var(--border);
          border-radius:5px;font-size:13px;font-family:inherit;text-align:center">
        <span style="font-size:11px;color:var(--muted)">2教科目：<b id="ratio2-disp">${r2}</b></span>
      </div>`:
      has2&&which===2?`<div style="font-size:11px;color:var(--muted);margin-bottom:6px;padding:3px 8px;background:#f5f6f8;border-radius:4px">比率：<b>${r2}</b>（1 − ${r1}）</div>`:'';
    return `<div>
      <div class="mcollabel ${lcls}">${lbl} ${unitNote}</div>
      ${ratioInput}
      <div class="mf"><label class="mfl">教科</label>
        <div class="chips" id="chips${which}">${makeChips(which)}</div>
        <input type="text" id="sinp${which}" value="${escHtml(sel)}" placeholder="直接入力">
      </div>
      <div class="mf"><label class="mfl">メモ</label>
        <textarea id="minp${which}" placeholder="単元・内容等">${escHtml(mv)}</textarea>
      </div>
      ${makeKourySection(which)}
    </div>`;
  }

  let body='';
  if(isMod){
    body=`<div class="mnote">このスロットはモジュール（1/${modN}単位時間）です。</div>${makeBlock(1)}`;
  } else if(has2){
    body=`<div class="m2cols">${makeBlock(1)}${makeBlock(2)}</div>
      <button class="del2btn" id="del2btn">2教科目を削除して1教科（1単位）に戻す</button>`;
  } else {
    body=`${makeBlock(1)}
      ${isFull?`<button class="add2btn" id="add2btn">＋ 2教科目を追加（比率はデフォルト0.5、変更可）</button>`:''}`;
  }
  body+=`<div class="mbtns">
    <button class="mbtn mbok" id="mok">保存</button>
    <button class="mbtn mbdel" id="mdel">このコマを削除</button>
    <button class="mbtn mbcancel" id="mcancel">キャンセル</button>
  </div>`;

  document.getElementById('mbody').innerHTML=body;
  document.getElementById('modal').classList.toggle('wide',has2);

  // ─ チップイベント（トグル：選択中を再クリックで解除）─
  document.querySelectorAll('.chip').forEach(b=>{
    b.addEventListener('click',()=>{
      const which=+b.dataset.cid, s=b.dataset.s, c=sColor(s);
      const current=which===1?mstate.s1:mstate.s2;
      if(current===s){
        // 選択中 → 解除
        b.style.background='#fff';b.style.color=c;b.style.borderColor=c+'55';
        if(which===1){mstate.s1='';const inp=document.getElementById('sinp1');if(inp)inp.value='';}
        else{mstate.s2='';const inp=document.getElementById('sinp2');if(inp)inp.value='';}
      } else {
        // 新規選択
        document.querySelectorAll(`.chip[data-cid="${which}"]`).forEach(x=>{
          const xc=sColor(x.dataset.s);
          x.style.background='#fff';x.style.color=xc;x.style.borderColor=xc+'55';
        });
        b.style.background=c;b.style.color='#fff';b.style.borderColor=c;
        if(which===1){mstate.s1=s;const inp=document.getElementById('sinp1');if(inp)inp.value=s;}
        else{mstate.s2=s;const inp=document.getElementById('sinp2');if(inp)inp.value=s;}
      }
      refreshKouryUI(which);
    });
  });

  // ─ テキスト直接入力 ─
  const sinp1=document.getElementById('sinp1');
  if(sinp1) sinp1.addEventListener('input',e=>{mstate.s1=e.target.value;refreshKouryUI(1);});
  const ratio1inp=document.getElementById('ratio1-inp');
  if(ratio1inp) ratio1inp.addEventListener('input',e=>{
    const v=Math.min(0.9,Math.max(0.1,parseFloat(e.target.value)||0.5));
    mstate.ratio1=Math.round(v*100)/100;
    const r2=Math.round((1-mstate.ratio1)*100)/100;
    const disp=document.getElementById('ratio2-disp');
    if(disp) disp.textContent=r2;
    const mcl2=document.querySelector('.mcollabel.mcl2');
    if(mcl2) mcl2.textContent=`2教科目 （${r2}単位）`;
  });
  const sinp2=document.getElementById('sinp2');
  if(sinp2) sinp2.addEventListener('input',e=>{mstate.s2=e.target.value;refreshKouryUI(2);});

  // ─ 2教科追加・削除 ─
  document.getElementById('add2btn')?.addEventListener('click',()=>{
    mstate.s1=document.getElementById('sinp1')?.value||mstate.s1;
    mstate.m1=document.getElementById('minp1')?.value||mstate.m1;
    // koury2 を koury1 と同じデフォルトで初期化
    const def2=kBadgesDefault(new Set());
    const ac=S.koury.children.filter(ch=>ch.active);
    mstate.koury2={};
    ac.forEach(ch=>{mstate.koury2[ch.id]=def2.has(ch.id);});
    mstate.has2=true;
    mstate.ratio1=0.5; // 2教科追加時はデフォルト0.5
    renderMBody();
  });
  document.getElementById('del2btn')?.addEventListener('click',()=>{
    mstate.s1=document.getElementById('sinp1')?.value||mstate.s1;
    mstate.m1=document.getElementById('minp1')?.value||mstate.m1;
    mstate.has2=false;mstate.s2='';mstate.m2='';
    renderMBody();
  });

  // ─ 交流児童チェックボックス ─
  document.querySelectorAll('.koury-cb').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const kid=cb.dataset.kid, which=+cb.dataset.which;
      const ch=S.koury.children.find(c=>c.id===kid);
      const key=`koury${which}`;
      mstate[key][kid]=cb.checked;
      const lbl=cb.closest('.koury-check-item');
      if(lbl&&ch){
        lbl.style.background=cb.checked?ch.color:'#fff';
        lbl.style.color=cb.checked?'#fff':ch.color;
      }
    });
  });

  document.getElementById('mok').onclick=saveModal;
  document.getElementById('mdel').onclick=delModal;
  document.getElementById('mcancel').onclick=closeModal;
}

function saveModal(){
  const{slotId,dk,m,w,has2}=mstate;
  const s1=document.getElementById('sinp1')?.value??mstate.s1;
  const m1=document.getElementById('minp1')?.value??mstate.m1;
  const s2=has2?(document.getElementById('sinp2')?.value??mstate.s2):'';
  const m2=has2?(document.getElementById('minp2')?.value??mstate.m2):'';

  // koury1：デフォルトと差分があれば保存、同じならnull
  function diffKoury(kouryMap, defShown, ac){
    if(!ac.length) return null;
    let hasDiff=false;
    for(const ch of ac){
      if((kouryMap[ch.id]??false)!==defShown.has(ch.id)){hasDiff=true;break;}
    }
    return hasDiff?{...kouryMap}:null;
  }
  const ac=S.koury.children.filter(ch=>ch.active);
  const def1=kBadgesDefault(new Set([s1].filter(Boolean)));
  const def2=kBadgesDefault(new Set([s2].filter(Boolean)));
  const kouryDiff1=diffKoury(mstate.koury1,def1,ac);
  const kouryDiff2=has2?diffKoury(mstate.koury2,def2,ac):null;

  const ratio1=has2?(mstate.ratio1??0.5):null;
  setCell(m,w,slotId,dk,{s1,m1,s2,m2,ratio1,koury1:kouryDiff1,koury2:kouryDiff2});
  closeModal();renderTT();renderJisuu();
}
function delModal(){
  const{slotId,dk,m,w}=mstate;
  setCell(m,w,slotId,dk,{s1:'',m1:'',s2:'',m2:'',ratio1:null,koury1:null,koury2:null});
  closeModal();renderTT();renderJisuu();
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('on');
  document.getElementById('modal').classList.remove('wide');
}

// ─── PATTERNS ────────────────────────────────────────────────────
function savePat(idx){
  const cells={};
  for(const sl of visSlots()){
    if(sl.base==='none') continue;
    cells[sl.id]={};
    for(const dk of DKEYS){
      const c=getCell(curMonth,curWeek,sl.id,dk);
      if(c.s1||c.s2) cells[sl.id][dk]={s1:c.s1,m1:c.m1,s2:c.s2,m2:c.m2,ratio1:c.ratio1??null,koury1:c.koury1||null,koury2:c.koury2||null};
    }
  }
  // メモ行（日別）もパターンに含める
  const memos=getWeekMemos(curMonth,curWeek);
  const memoData={};
  ['asa','gyoukan','lunch','leave','hw','renraku'].forEach(key=>{
    memoData[key]={...memos[key]};
  });
  memoData.weekly_aim=memos.weekly_aim||'';
  memoData.notice=memos.notice||'';
  S.patterns[idx].cells=cells;
  S.patterns[idx].memos=memoData;
  save();buildPatMenus();
}
function loadPat(idx){
  if(!confirm(`パターン「${S.patterns[idx].name||'パターン'+(idx+1)}」を現在の週に読み込みます。\n現在の入力内容は上書きされます。よろしいですか？`)) return;
  const cells=S.patterns[idx].cells||{};
  for(const sid in cells) for(const dk in cells[sid]) setCell(curMonth,curWeek,sid,dk,cells[sid][dk]);
  // メモ行の復元（パターンにmemosが含まれている場合のみ）
  const memoData=S.patterns[idx].memos;
  if(memoData){
    ['asa','gyoukan','lunch','leave','hw','renraku'].forEach(key=>{
      const dayObj=memoData[key];
      if(!dayObj) return;
      DKEYS.forEach(dk=>{
        if(dayObj[dk]!==undefined) setWeekMemo(curMonth,curWeek,key,dayObj[dk],dk);
      });
    });
    if(memoData.weekly_aim!==undefined) setWeekMemo(curMonth,curWeek,'weekly_aim',memoData.weekly_aim);
    if(memoData.notice!==undefined) setWeekMemo(curMonth,curWeek,'notice',memoData.notice);
  }
  renderTT();renderJisuu();
}
function buildPatMenus(){
  const sm=document.getElementById('psave-menu'),lm=document.getElementById('pload-menu');
  if(!sm||!lm) return;
  sm.innerHTML=S.patterns.map((p,i)=>`<div class="pat-item" data-pi="${i}">パターン${i+1}${p.name?`：${p.name}`:''}</div>`).join('');
  lm.innerHTML=S.patterns.map((p,i)=>{
    const has=p.cells&&Object.keys(p.cells).length>0;
    return `<div class="pat-item${has?'':' no-data'}" data-pi="${i}">パターン${i+1}${p.name?`：${p.name}`:''} ${has?'':'（未設定）'}</div>`;
  }).join('');
  sm.querySelectorAll('.pat-item').forEach(el=>el.onclick=()=>{savePat(+el.dataset.pi);sm.style.display='none';});
  lm.querySelectorAll('.pat-item:not(.no-data)').forEach(el=>el.onclick=()=>{loadPat(+el.dataset.pi);lm.style.display='none';});
}

// ─── SUMMARY ─────────────────────────────────────────────────────
function renderSummary(){
  const ts=targets();
  const totalWks=S.yearTotalWeeks||35;

  // 実施数テーブル生成（colKeysの月/学期ごと + 末尾に合計列）
  function makeCountTable(dataMap,colKeys,colLabels,showTotalCol){
    const showMod=hasActiveMod();
    const colN=showMod?4:3; // モ列の有無で列数変化
    const allKeys=showTotalCol?[...colKeys,'__total__']:colKeys;
    const allLabels=showTotalCol?[...colLabels,'計']:colLabels;
    const subHd=showMod
      ?'<th class="sf">フル</th><th class="sh">½</th><th class="sm">モ</th><th>計</th>'
      :'<th class="sf">フル</th><th class="sh">½</th><th>計</th>';
    const hd='<tr><th>教科</th>'+allKeys.map((k,i)=>`<th colspan="${colN}">${allLabels[i]}</th>`).join('')+'</tr>'+
      '<tr><th></th>'+allKeys.map(()=>subHd).join('')+'</tr>';
    let rows='';const sums=allKeys.map(()=>({f:0,h:0,m:0,t:0}));
    ts.forEach(t=>{
      const has=colKeys.some(k=>dataMap[k]?.[t]?.tot>0);if(!has)return;
      const col=SCOLORS[t]||'#444';
      rows+=`<tr><td style="color:${col}">${t}</td>`;
      let totF=0,totH=0,totM=0,totT=0;
      colKeys.forEach((k,i)=>{
        const d=dataMap[k]?.[t]||{full:0,half:0,mod:0,tot:0};
        sums[i].f+=d.full;sums[i].h+=d.half;sums[i].m+=d.modTime||0;sums[i].t+=d.tot;
        totF+=d.full;totH+=d.half;totM+=d.modTime||0;totT+=d.tot;
        if(!d.tot){rows+=`<td colspan="${colN}" style="color:#dde1e8;text-align:center">-</td>`;return;}
        const modCell=showMod?`<td class="sm">${fmtN(d.modTime)||'-'}</td>`:'';  // 実時数
        rows+=`<td class="sf">${d.full||'-'}</td><td class="sh">${d.half||'-'}</td>${modCell}<td><b>${fmtN(d.tot)}</b></td>`;
      });
      if(showTotalCol){
        const li=allKeys.length-1;
        sums[li].f+=totF;sums[li].h+=totH;sums[li].m+=totM;sums[li].t+=totT;
        const modTot=showMod?`<td class="sm" style="background:#f7f9fc">${fmtN(totM)||'-'}</td>`:'';  // 実時数
        rows+=`<td class="sf" style="background:#f7f9fc">${fmtNz(totF)}</td><td class="sh" style="background:#f7f9fc">${fmtNz(totH)}</td>${modTot}<td style="background:#f7f9fc"><b>${fmtNz(totT)}</b></td>`;
      }
      rows+='</tr>';
    });
    const ft=allKeys.map((k,i)=>{
      const modFt=showMod?`<td class="sm">${fmtNz(sums[i].m)}</td>`:'';
      return `<td class="sf">${fmtNz(sums[i].f)}</td><td class="sh">${fmtNz(sums[i].h)}</td>${modFt}<td><b>${fmtNz(sums[i].t)}</b></td>`;
    }).join('');
    return `<table class="stbl"><thead>${hd}</thead><tbody>${rows}</tbody><tfoot><tr><td>合計</td>${ft}</tr></tfoot></table>`;
  }

  // 実施率テーブル生成
  function makeRateTable(dataMap,colKeys,colLabels,colWeeks,showTotalCol,totalWeeks){
    const allKeys=showTotalCol?[...colKeys,'__total__']:colKeys;
    const allLabels=showTotalCol?[...colLabels,'計']:colLabels;
    const allWeeks=showTotalCol?[...colWeeks,colWeeks.reduce((a,b)=>a+b,0)]:colWeeks;
    const hd='<tr><th>教科</th>'+allKeys.map((k,i)=>`<th colspan="2">${allLabels[i]}</th>`).join('')+'</tr>'+
      '<tr><th></th>'+allKeys.map(()=>'<th>計画%</th><th>標準%</th>').join('')+'</tr>';
    let rows='';
    ts.forEach(t=>{
      const has=colKeys.some(k=>dataMap[k]?.[t]?.tot>0);if(!has)return;
      const col=SCOLORS[t]||'#444';
      const pl=planForTarget(t);
      rows+=`<tr><td style="color:${col}">${t}</td>`;
      // 合計列用の実績
      let totActual=0;
      colKeys.forEach((k,i)=>{
        const d=dataMap[k]?.[t]||{full:0,half:0,mod:0,tot:0};
        totActual+=d.tot;
        const rPlan=calcRate(d.tot,pl.planTotal,allWeeks[i],totalWeeks);
        const rStd= calcRate(d.tot,pl.planStd, allWeeks[i],totalWeeks);
        rows+=`<td class="${rateCls(rPlan)}">${fmtRate(rPlan)}</td><td class="${rateCls(rStd)}">${fmtRate(rStd)}</td>`;
      });
      if(showTotalCol){
        const li=allKeys.length-1;
        const rPlan=calcRate(totActual,pl.planTotal,allWeeks[li],totalWeeks);
        const rStd= calcRate(totActual,pl.planStd, allWeeks[li],totalWeeks);
        rows+=`<td class="${rateCls(rPlan)}" style="background:#f7f9fc">${fmtRate(rPlan)}</td><td class="${rateCls(rStd)}" style="background:#f7f9fc">${fmtRate(rStd)}</td>`;
      }
      rows+='</tr>';
    });
    return `<table class="stbl"><thead>${hd}</thead><tbody>${rows}</tbody></table>`;
  }

  // 第3階層タブ描画
  const sumTabDefs=[

function semOf(m){for(const[s,sd]of Object.entries(SEMS))if(sd.months.includes(m))return s;return'1';}
// ─── 【STEP5】週ナビゲーション ───────────────────────────────────
function navigateToWeek(month,week){
  const sem=semOf(month);
  curSem=sem;curMonth=month;curWeek=week;
  document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));
  document.querySelector(`.stab[data-sem="${sem}"]`)?.classList.add('on');
  showView('sem');setSem(sem);
}
function prevWeekNav(){
  const vw=validWeeksForMonth(curMonth);
  const idx=vw.indexOf(curWeek);
  if(idx>0){navigateToWeek(curMonth,vw[idx-1]);return;}
  const mi=MONTH_ORDER.indexOf(curMonth);
  if(mi<=0) return;
  const prevM=MONTH_ORDER[mi-1];
  const prevVw=validWeeksForMonth(prevM);
  if(prevVw.length>0) navigateToWeek(prevM,prevVw[prevVw.length-1]);
}
function nextWeekNav(){
  const vw=validWeeksForMonth(curMonth);
  const idx=vw.indexOf(curWeek);
  if(idx<vw.length-1){navigateToWeek(curMonth,vw[idx+1]);return;}
  const mi=MONTH_ORDER.indexOf(curMonth);
  if(mi>=MONTH_ORDER.length-1) return;
  const nextM=MONTH_ORDER[mi+1];
  const nextVw=validWeeksForMonth(nextM);
  if(nextVw.length>0) navigateToWeek(nextM,nextVw[0]);
}
function gotoToday(){
  const today=new Date();
  const m=today.getMonth()+1;
  const vw=validWeeksForMonth(m);
  let targetWeek=vw[0]||1;
  for(const w of vw){
    const monday=calcMonday(S.year,m,w);
    const sun=new Date(monday);sun.setDate(sun.getDate()-1);
    const sat=new Date(monday);sat.setDate(sat.getDate()+5);
    if(today>=sun&&today<=sat){targetWeek=w;break;}
  }
  navigateToWeek(m,targetWeek);
}
function showView(v){
  curView=v;
  const isCfg=v==='cfg',isSem=v==='sem',isYear=v==='year';
  document.getElementById('cfg-view').classList.toggle('on',isCfg);
  document.getElementById('mbar').style.display=isSem?'flex':'none';
  document.getElementById('wbar').style.display=isSem?'flex':'none';
  document.getElementById('tt-wrap').style.display=isSem?'':'none';
  document.getElementById('jisuu').style.display=isSem?'':'none';
  document.getElementById('jisuu-resizer').style.display=isSem?'block':'none';
  const sv=document.getElementById('sum-view');
  if(isYear){
    sv.style.display='flex';
    renderSummary();
  } else {
    sv.style.display='none';
  }
  if(isCfg) renderCfg();
}

function setSem(s){
  curSem=s;
  if(!SEMS[s].months.includes(curMonth)) curMonth=SEMS[s].months[0];
  const mb=document.getElementById('mbar');mb.innerHTML='';
  SEMS[s].months.forEach(m=>{

function setMonth(m){

  curWeek=validWeeksForMonth(m)[0]||1;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('on',+t.dataset.m===m));

function refreshWbar(){
  const validWks=validWeeksForMonth(curMonth);
  // curWeek が有効週でなければ最初の有効週に補正
  if(!validWks.includes(curWeek)) curWeek=validWks[0]||1;

  const cont=document.getElementById('wbtns');cont.innerHTML='';
  validWks.forEach(w=>{
    const b=document.createElement('button');

    b.onclick=()=>{curWeek=w;refreshWbar();renderTT();renderJisuu();};
    cont.appendChild(b);
  });
  // 月曜日付（保存済みがあればそれ、なければ自動計算）
  const storedDate=getWDate(curMonth,curWeek);
  const autoDate=localDateStr(calcMonday(S.year,curMonth,curWeek));
  const effDate=storedDate||autoDate;
  document.getElementById('wdate').value=effDate;
  const ne=document.getElementById('wbar-note');
  if(effDate){
    const dt=new Date(effDate),fe=new Date(effDate);fe.setDate(fe.getDate()+4);
    ne.textContent=`${dt.getMonth()+1}/${dt.getDate()}〜${fe.getMonth()+1}/${fe.getDate()}`;
    if(!storedDate) ne.textContent+=' (自動)';
  } else ne.textContent='';
  // 土日切替ボタン
  let dayBtns=document.getElementById('wbar-day-btns');

  document.getElementById('btn-sat').onclick=()=>{S.showSat=!S.showSat;save();refreshWbar();renderTT();};

// 印刷用の表示曜日を決定（土日はデータがある方のみ、最大6列＋月曜前日曜）
function getPrintDKeys(){

  const base=['mon','tue','wed','thu','fri'];

// 印刷用集計HTMLを生成
function buildPrintSummary(){
  const ts=targets();
  const totalWks=S.yearTotalWeeks||35;
  // 経過有効週数（学期・年度用）
  const semMonths=SEMS[curSem].months;
  const ci=semMonths.indexOf(curMonth);
  const semWks=semMonths.slice(0,ci).reduce((s,m)=>s+validWeeksForPlan(m).length,0)
               +validWeeksForPlan(curMonth).filter(w=>w<=curWeek).length;
  let yearWks=0;let reached=false;
  for(const m of MONTH_ORDER){
    for(const w of validWeeksForPlan(m)){
      if(m===curMonth&&w===curWeek){yearWks++;reached=true;break;}
      yearWks++;
    }
    if(reached) break;
  }
  const wAct=calcWeek(curMonth,curWeek);
  const sAct=calcCumSem();
  const yAct=calcCumulative();

  function tbl(label,actual,period){
    let rows='';
    ts.forEach(t=>{
      const d=actual[t]||{full:0,half:0,mod:0,tot:0};
      const pl=planForTarget(t);
      const nonMod=d.full+d.half*0.5; // 実数
      const modV=d.tot-nonMod; // 実数
      const rPlan=calcRate(d.tot,pl.planTotal,period,totalWks);
      const planCls=rateCls(rPlan);
      if(label==='当週実施数'){
        rows+=`<tr><td>${t}</td><td>${d.full||'-'}</td><td>${d.half||'-'}</td><td>${fmtN(d.modTime)||'-'}</td><td>${fmtN(d.tot)||'-'}</td></tr>`;  // モ=実時数
      } else {
        rows+=`<tr><td>${t}</td><td class="${rateCls(calcRate(nonMod,pl.planFull,period,totalWks))}">${fmtRate(calcRate(nonMod,pl.planFull,period,totalWks))}</td><td class="${rateCls(calcRate(modV,pl.planMod,period,totalWks))}">${fmtRate(calcRate(modV,pl.planMod,period,totalWks))}</td><td class="${planCls}">${fmtRate(rPlan)}</td></tr>`;
      }
    });
    const hd=label==='当週実施数'?'<th>教科</th><th>フル</th><th>½</th><th>モ</th><th>計</th>':
      '<th>教科</th><th>モ外%</th><th>モ%</th><th>計%</th>';
    return `<div><div class="ps-title">${label}</div>
      <table><thead><tr>${hd}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `<div class="ps-row">
    ${tbl('当週実施数',wAct,1)}
    ${tbl('学期累計 計画実施率',sAct,semWks)}
    ${tbl('年度累計 計画実施率',yAct,yearWks)}
  </div>`;
}

function printWeek(skipTitle=false){
  if(curView!=='sem'){alert('週案タブを表示した状態で印刷してください。');return;}
  const pdk=getPrintDKeys();
  const allDk=visibleDKeys();

  // ヘッダーth に印刷列制御クラスを付与
  document.querySelectorAll('#tth th').forEach((th,i)=>{
    if(i===0){th.classList.remove('print-hide-col');return;}
    const dk=allDk[i-1];
    if(pdk.includes(dk)) th.classList.remove('print-hide-col');
    else th.classList.add('print-hide-col');
  });
  // data-dk を持つすべてのtd（スロット行 + 日別メモ行）を一括制御
  document.querySelectorAll('#ttb td[data-dk]').forEach(td=>{
    if(pdk.includes(td.dataset.dk)) td.classList.remove('print-hide-col');
    else td.classList.add('print-hide-col');
  });
  document.querySelectorAll('td.sltd').forEach(td=>td.classList.remove('print-hide-col'));
  // colspan調整：週単位メモ行（notes）のみ対象
  const printCols=pdk.length;
  document.querySelectorAll('td.memo-cell[colspan]').forEach(td=>{
    td.setAttribute('colspan',printCols);
  });

  document.getElementById('print-summary').innerHTML=buildPrintSummary();

  // 印刷ヘッダー（配布用印刷からの呼び出し時はスキップ）
  if(!skipTitle){
    const mondayStr2=getEffectiveMonday(curMonth,curWeek);
    const dateLabel2=mondayStr2?(()=>{
      const dt=new Date(mondayStr2),fe=new Date(mondayStr2);fe.setDate(fe.getDate()+4);
      return `${dt.getMonth()+1}/${dt.getDate()}〜${fe.getMonth()+1}/${fe.getDate()}`;
    })():'';
    document.getElementById('print-hd-title').textContent=
      `${S.year}年度　${S.cls||''}　${curMonth}月 第${curWeek}週　週案`;
    document.getElementById('print-hd-sub').textContent=
      `${dateLabel2}　担任：${S.teacher||''}`;
  }

  // ── textarea → div に変換してテキスト全表示 ──
  const taMap=[];
  document.querySelectorAll('#tt-wrap textarea[data-memokey], #tt-wrap textarea[data-scheduledate], #tt-wrap textarea.schedule-ta').forEach(ta=>{
    const div=document.createElement('div');
    div.className='print-ta-div';
    // 行事行は全角スペースを改行に変換して印刷
    if(ta.classList.contains('schedule-ta')){
      div.innerHTML=escHtml(ta.value).replace(/　/g,'<br>');
    } else {
      div.textContent=ta.value;
    }
    if(ta.dataset.memokey) div.dataset.memokey=ta.dataset.memokey;
    if(ta.dataset.isodate) div.dataset.isodate=ta.dataset.isodate;
    if(ta.dataset.dk) div.dataset.dk=ta.dataset.dk;
    if(ta.classList.contains('schedule-ta')) div.classList.add('schedule-ta-div');
    ta.parentNode.replaceChild(div,ta);
    taMap.push({div,val:ta.value,key:ta.dataset.memokey||null,isodate:ta.dataset.isodate||null,dk:ta.dataset.dk||null,isSched:ta.classList.contains('schedule-ta')});
  });

  // ── 教科名：印刷幅に収まらない場合フォントサイズを縮小 ──
  const snameMap=[];
  document.querySelectorAll('#ttb .sname').forEach(el=>{
    const orig=el.style.fontSize||'';
    let fs=10;
    el.style.fontSize=fs+'px';
    el.style.whiteSpace='nowrap';
    while(el.scrollWidth>el.offsetWidth&&fs>6){fs-=0.5;el.style.fontSize=fs+'px';}
    snameMap.push({el,orig});
  });

  window.print();

  // ── 縮小スタイルをリセット ──
  snameMap.forEach(({el,orig})=>{el.style.fontSize=orig;el.style.whiteSpace='';});
  setTimeout(()=>{
    taMap.forEach(({div,val,key,isodate,dk,isSched})=>{
      const ta=document.createElement('textarea');
      if(key) ta.dataset.memokey=key;
      if(isodate) ta.dataset.isodate=isodate;
      if(dk) ta.dataset.dk=dk;
      if(isSched) ta.classList.add('schedule-ta');
      ta.value=val;
      ta.style.cssText='width:100%;border:none;background:transparent;font-family:inherit;font-size:11px;resize:none;padding:1px 3px;outline:none;color:var(--text);min-height:20px;overflow:hidden';
      autoGrowTA(ta);
      ta.addEventListener('input',()=>{
        autoGrowTA(ta);
        if(ta.dataset.memokey) setWeekMemo(curMonth,curWeek,ta.dataset.memokey,ta.value,ta.dataset.dk||null);
        if(ta.dataset.isodate){S.schedule[ta.dataset.isodate]=ta.value;save();}
      });
      div.parentNode.replaceChild(ta,div);
    });
    document.querySelectorAll('.print-hide-col').forEach(el=>el.classList.remove('print-hide-col'));
    document.querySelectorAll('td.memo-cell[colspan]').forEach(td=>td.setAttribute('colspan',allDk.length));
    document.getElementById('print-summary').innerHTML='';
  },600);
}

function initResizer(){
  const resizer=document.getElementById('jisuu-resizer');
  const jisuu=document.getElementById('jisuu');
  let startX=0,startW=0,dragging=false;
  resizer.addEventListener('mousedown',e=>{
    dragging=true;startX=e.clientX;startW=jisuu.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.userSelect='none';
    document.body.style.cursor='col-resize';
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const diff=startX-e.clientX; // 右から左にドラッグ→広がる
    const newW=Math.max(160,Math.min(480,startW+diff));
    jisuu.style.width=newW+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging) return;
    dragging=false;resizer.classList.remove('dragging');
    document.body.style.userSelect='';document.body.style.cursor='';
  });
  // ダブルクリックでデフォルト幅に戻す
  resizer.addEventListener('dblclick',()=>{jisuu.style.width='238px';});
}

function showSetupModal(){
  hideStartupScreen();
  renderSetupBody();
  document.getElementById('setup-overlay').classList.add('on');
  document.getElementById('setup-save-msg').style.display='none';
  checkSetupOk();

  // キャンセル（起動画面に戻る）
  document.getElementById('setup-cancel').onclick=()=>{
    // S をデフォルトにリセット（途中入力をクリア）
    S.koury.mode='normal';
    S.grade=3;S.classNum=1;S.gradeSet=false;
    S.cls='';S.teacher='';
    document.getElementById('inp-class').value='';
    document.getElementById('inp-teacher').value='';
    document.getElementById('setup-overlay').classList.remove('on');
    showStartupScreen();
  };

  // OK → 値を確定 → saveToFile → _enterAppInternal
  document.getElementById('setup-ok').onclick=async()=>{
    if(!document.getElementById('setup-ok').classList.contains('ready')) return;
    // 学年・クラス・モードを確定
    const gradeEl=document.getElementById('setup-grade');
    const classnumEl=document.getElementById('setup-classnum');
    if(S.koury.mode==='senka'){
      S.grade='senka';S.gradeSet=true;S.classNum=null;S.subjects=[];
    } else if(gradeEl&&+gradeEl.value>0){
      S.grade=+gradeEl.value;S.gradeSet=true;
      const classType=S.koury.mode==='normal'?'normal':'tokushi';
      S.subjects=defSubjectsForGrade(S.grade,classType);
      applyPlanStdDefaults();
    }
    if(classnumEl&&+classnumEl.value>0) S.classNum=+classnumEl.value;
    // ヘッダー更新
    document.getElementById('inp-school').value=S.schoolName||'';
    document.getElementById('inp-class').value=S.cls;
    document.getElementById('inp-teacher').value=S.teacher;
    updateSchoolNameWarn();
    // 保存処理
    await _setupSaveAndEnter();
  };

  // 再試行
  document.getElementById('setup-save-retry').onclick=async()=>await _setupSaveAndEnter();
}

async function _setupSaveAndEnter(){
  const msgBox=document.getElementById('setup-save-msg');
  const msgText=document.getElementById('setup-save-msg-text');
  msgBox.style.display='none';
  try{
    await _doSaveToFile();
    _enterAppInternal();
  }catch(e){
    if(e.name==='AbortError'){
      msgText.textContent='保存をキャンセルしました。データを保護するために保存してから開始することをお勧めします。';
    } else {
      msgText.textContent='保存に失敗しました：'+e.message;
    }
    msgBox.style.display='block';
  }
}

// ─── レポート用予定時数計算（端数吸収付き） ──────────────────────
// 各学期の有効週数を返す
function semValidWeeks(sem){
  return validWeekCountForMonths(SEMS[sem].months);
}

// ─── 按分用週数（8月は長期休業未入力でも常に除外）────────────────
// 実績集計は SEMS定義通り（8月実績は1学期に含まれる）
// 按分計算のみこの定義を使用する
const PLAN_SEM_MONTHS={
  '1':[4,5,6,7],   // 8月を除外（夏休みが常に存在するという前提）
  '2':[9,10,11,12],
  '3':[1,2,3]
};
function semValidWeeksForPlan(sem){
  return validWeekCountForMonths(PLAN_SEM_MONTHS[sem]);
}

// 月の有効週数（選択期間内に限定。limitWeek省略=全週）
function monthValidWeeks(m, limitWeek=999){
  return validWeeksForPlan(m).filter(w=>w<=limitWeek).length;
}

// 学期の吸収月（有効週ゼロなら順延）
const SEM_ABSORB_MONTHS={
  '1':[6,7,5,4],
  '2':[10,11,9,12],
  '3':[2,1,3]
};
function absorbMonthForSem(sem){
  for(const m of SEM_ABSORB_MONTHS[sem]){
    if(validWeeksForPlan(m).length>0) return m;
  }
  return SEMS[sem].months[0]; // フォールバック
}

// 教科tの学期別予定時数（整数、端数は2学期吸収）
// 戻り値: {'1':n,'2':n,'3':n}
function planBySem(t){
  const total=planForTarget(t).planTotal;
  // 按分は8月除外の週数で計算（実績集計とは独立）
  const wks={'1':semValidWeeksForPlan('1'),'2':semValidWeeksForPlan('2'),'3':semValidWeeksForPlan('3')};
  const sumWks=wks['1']+wks['2']+wks['3'];
  if(!sumWks||!total) return {'1':0,'2':0,'3':0};
  const p1=Math.round(total*wks['1']/sumWks);
  const p3=Math.round(total*wks['3']/sumWks);
  const p2=total-p1-p3; // 2学期で端数吸収
  return {'1':p1,'2':p2,'3':p3};
}

// 教科tの月別予定時数（整数、各学期内の吸収月で端数吸収）
// 戻り値: {4:n,5:n,...,3:n}
function planByMonth(t){
  const bySem=planBySem(t);
  const result={};
  for(const sem of ['1','2','3']){
    const semTotal=bySem[sem];
    // 按分対象月は8月除外リスト（ただし8月のエントリは0で出力）
    const planMons=PLAN_SEM_MONTHS[sem];
    const allMons=SEMS[sem].months;
    const semWks=semValidWeeksForPlan(sem);
    const absorb=absorbMonthForSem(sem);
    let assigned=0;
    const tmp={};
    for(const m of planMons){
      if(m===absorb){tmp[m]=null;continue;}
      const mw=validWeeksForPlan(m).length;
      const raw=semWks>0?semTotal*mw/semWks:0;
      tmp[m]=Math.round(raw);
      assigned+=tmp[m];
    }
    tmp[absorb]=semTotal-assigned; // 端数吸収
    // 8月は按分対象外（予定0）だが、エントリは存在させる
    for(const m of allMons){
      if(!(m in tmp)) tmp[m]=0;
    }
    Object.assign(result,tmp);
  }
  return result;
}

// 教科tの週別予定時数（整数、各月内の第2週で端数吸収）
// 戻り値: {m:{w:n,...},...}
function planByWeek(t){
  const byMonth=planByMonth(t);
  const result={};
  for(const m of MONTH_ORDER){
    const mTotal=byMonth[m]||0;
    const weeks=validWeeksForPlan(m);
    if(!weeks.length){result[m]={};continue;}
    const tmp={};
    let assigned=0;
    const absorb=weeks.length>=2?weeks[1]:weeks[0]; // 第2週（なければ第1週）
    for(const w of weeks){
      if(w===absorb){tmp[w]=null;continue;}
      const raw=weeks.length>0?mTotal/weeks.length:0;
      tmp[w]=Math.round(raw);
      assigned+=tmp[w];
    }
    tmp[absorb]=mTotal-assigned;
    result[m]=tmp;
  }
  return result;
}

// モジュール分の学期別予定（端数は2学期吸収）
function planModBySem(t){
  const totalMod=planForTarget(t).planMod;
  const wks={'1':semValidWeeksForPlan('1'),'2':semValidWeeksForPlan('2'),'3':semValidWeeksForPlan('3')};
  const sumWks=wks['1']+wks['2']+wks['3'];
  if(!sumWks||!totalMod) return {'1':0,'2':0,'3':0};
  const p1=Math.round(totalMod*wks['1']/sumWks);
  const p3=Math.round(totalMod*wks['3']/sumWks);
  const p2=totalMod-p1-p3;
  return {'1':p1,'2':p2,'3':p3};
}

// モジュール分の月別予定
function planModByMonth(t){
  const bySem=planModBySem(t);
  const result={};
  for(const sem of ['1','2','3']){
    const semTotal=bySem[sem];
    const planMons=PLAN_SEM_MONTHS[sem];
    const allMons=SEMS[sem].months;
    const semWks=semValidWeeksForPlan(sem);
    const absorb=absorbMonthForSem(sem);
    let assigned=0;const tmp={};
    for(const m of planMons){
      if(m===absorb){tmp[m]=null;continue;}
      const mw=validWeeksForPlan(m).length;
      tmp[m]=semWks>0?Math.round(semTotal*mw/semWks):0;
      assigned+=tmp[m];
    }
    tmp[absorb]=semTotal-assigned;
    Object.assign(result,tmp);
  }
  return result;
}
